<title>Tablero de Ventas — NEW PGA · Comercializadora LP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#eef1f5; --surface:#ffffff; --surface2:#f6f8fb; --ink:#16202e; --muted:#5c6b80;
  --border:#dde3ec; --accent:#0b7285; --accent2:#12a4bd; --accent-soft:#e2f2f5;
  --good:#17915c; --good-soft:#e3f3ec; --warn:#b3790f; --warn-soft:#f8efd8; --warn2:#e8890c;
  --bad:#c0442e; --bad-soft:#f8e6e2; --accent2-rgb:18,164,189;
  --shadow:0 1px 2px rgba(20,32,46,.04),0 3px 10px rgba(20,32,46,.05);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0d1219; --surface:#151d28; --surface2:#1b2530; --ink:#e6edf5; --muted:#93a2b6;
    --border:#26303d; --accent:#19a2b8; --accent2:#38c5da; --accent-soft:#123038;
    --good:#33b57e; --good-soft:#12291f; --warn:#d99f2b; --warn-soft:#2b2413; --warn2:#f2973a; --bad:#e26a52; --bad-soft:#2e1a15; --accent2-rgb:56,197,218;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1219; --surface:#151d28; --surface2:#1b2530; --ink:#e6edf5; --muted:#93a2b6;
  --border:#26303d; --accent:#19a2b8; --accent2:#38c5da; --accent-soft:#123038;
  --good:#33b57e; --good-soft:#12291f; --warn:#d99f2b; --warn-soft:#2b2413; --warn2:#f2973a; --bad:#e26a52; --bad-soft:#2e1a15; --accent2-rgb:56,197,218;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --ground:#eef1f5; --surface:#ffffff; --surface2:#f6f8fb; --ink:#16202e; --muted:#5c6b80;
  --border:#dde3ec; --accent:#0b7285; --accent2:#12a4bd; --accent-soft:#e2f2f5;
  --good:#17915c; --good-soft:#e3f3ec; --warn:#b3790f; --warn-soft:#f8efd8; --warn2:#e8890c; --bad:#c0442e; --bad-soft:#f8e6e2; --accent2-rgb:18,164,189;
  --shadow:0 1px 2px rgba(20,32,46,.04),0 3px 10px rgba(20,32,46,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
.head{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.stamp{text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.stamp b{color:var(--ink);font-weight:700}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:18px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.accent{background:linear-gradient(160deg,var(--accent) 0%,var(--accent2) 130%);border-color:transparent;color:#fff}
.kpi.accent .lab,.kpi.accent .foot{color:rgba(255,255,255,.82)}
.kpi.bad .val{color:var(--bad)}

/* nav */
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:var(--ink);border-color:var(--accent2)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

main{padding:20px 0 60px}
.panel{display:none;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.panel.on{animation:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card,.grid+.grid,.grid+.card,.card+.grid{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.ctitle{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.ctitle h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.ctitle .hint{font-size:12px;color:var(--muted)}

/* filter */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
select.fsel{font-size:14px;font-weight:600;padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-width:260px;cursor:pointer}
select.fsel:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
tr.submarca td:first-child{padding-left:28px;color:var(--muted);font-weight:500}

/* tables */
table{width:100%;border-collapse:collapse}
.twrap{overflow-x:auto}
th,td{text-align:right;padding:9px 12px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;
  border-bottom:2px solid var(--border);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
thead th.no-sort{cursor:default}
tbody td{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
tr.subhead td{background:var(--surface2);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border)}
#p-ficha tr.subhead td{font-size:12px}
#p-accion tr.subhead td{font-size:12px}
tr.colrep td{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface);border-bottom:1px solid var(--border);padding:5px 12px}
tr.total td{font-weight:800;border-top:2px solid var(--border);border-bottom:none;background:var(--surface2)}
tr.grandtotal td{font-weight:800;background:var(--accent-soft);border-bottom:none}
td.name{font-weight:600}
.mono{font-variant-numeric:tabular-nums}

/* pills + bars */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface2);color:var(--muted)}
.cov{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cov .track{width:64px;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.cov .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.cov .pct{min-width:44px;text-align:right;font-weight:700}

/* supervisor cards */
.supgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.kpitiles{display:grid;gap:14px;margin-bottom:14px}
.supcard{border:1px solid var(--border);border-radius:var(--r);padding:15px;background:linear-gradient(165deg,var(--surface),var(--surface2))}
.supcard h3{font-size:14px;font-weight:800}
.supcard .who{font-size:11px;color:var(--muted);margin-bottom:12px}
.supcard .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px dashed var(--border)}
.supcard .row .l{font-size:12px;color:var(--muted)}
.supcard .row .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.supcard .big{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}

/* svg chart bits */
.chart{width:100%;height:auto;display:block}
.barlabel{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.barname{font-size:11.5px;fill:var(--ink);font-weight:600}
.axis{stroke:var(--border);stroke-width:1}
.gridln{stroke:var(--border);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.kpitiles{grid-template-columns:repeat(2,1fr) !important}}
/* Impresión / PDF: solo el reporte diario, ordenado y con colores */
@media print{
  @page{ size:A4 landscape; margin:8mm; }
  html,body{ background:#fff !important; }
  header, nav.tabs, .wrap > section.kpis, select.fsel, .tab, .no-print{ display:none !important; }
  main.wrap{ padding:0 !important; max-width:100% !important; }
  .panel{ display:none !important; }
  body:not(.print-ruta) #p-diario{ display:block !important; }
  body.print-ruta #p-ruta{ display:block !important; }
  .card{ box-shadow:none !important; border:1px solid #cfd6e0 !important; break-inside:avoid; margin:0 0 8px 0 !important; padding:10px 12px !important; }
  .card+.card,.grid+.grid,.grid+.card,.card+.grid{ margin-top:8px !important; }
  .grid{ gap:8px !important; }
  .grid.g2,.grid.g3{ grid-template-columns:1fr 1fr !important; }
  .twrap{ overflow:visible !important; }
  table{ font-size:9.5px !important; width:100% !important; }
  th,td{ padding:3px 6px !important; }
  .kpis{ display:grid !important; grid-template-columns:repeat(6,1fr) !important; gap:6px !important; padding:0 !important; }
  .kpi{ padding:7px 9px !important; } .kpi .val{ font-size:15px !important; } .kpi .lab{ font-size:8px !important; } .kpi .foot{ font-size:8px !important; }
  .supgrid{ grid-template-columns:repeat(3,1fr) !important; gap:8px !important; }
  .kpitiles{ grid-template-columns:repeat(3,1fr) !important; gap:8px !important; margin-bottom:8px !important; }
  .supcard{ padding:8px 10px !important; } .supcard .big{ font-size:16px !important; }
  .ctitle h2{ font-size:13px !important; } .ctitle .hint{ font-size:9px !important; }
  .cov .track,.track{ border:1px solid #bbb !important; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body{ font-size:10px; }
}

const pct = n => (n==null?'—':AR.format(n)+'%');
const fdate = s => { const [y,m,d]=s.split('-'); return d+'/'+m; };

const covColor = c => (c==null)?'var(--muted)':(c>=40?'var(--good)':c>=20?'var(--warn)':(c>=8?'var(--warn2)':'var(--bad)'));
const alertClass = a => a==='OK'?'ok':a==='BAJA'?'warn':a==='SIN VENTA'?'bad':'neu';

/* ---------- header + kpis ---------- */

/* ---------- SVG chart builders ---------- */
function hbars(items,{val,label,color,fmt=peso,h=28,gap=8,namew=150,w=680}){
  const max=Math.max(...items.map(val),1);
  const H=items.length*(h+gap)+10;
  const bw=w-namew-90;
  let s=`<svg viewBox="0 0 ${w} ${H}" class="chart" role="img">`;
  items.forEach((it,i)=>{
    const y=i*(h+gap)+5; const v=val(it); const len=Math.max(2,bw*v/max);
    const col=typeof color==='function'?color(it):color;
    s+=`<text x="0" y="${y+h/2+4}" class="barname">${label(it)}</text>`;
    s+=`<rect x="${namew}" y="${y}" width="${len}" height="${h}" rx="5" fill="${col}"/>`;
    s+=`<text x="${namew+len+7}" y="${y+h/2+4}" class="barlabel">${fmt(v)}</text>`;
  });
  return s+'</svg>';
}
function areaChart(items,{w=980,h=260}){
  const pad={l:54,r:16,t:16,b:34};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=items.map(d=>d.venta); const max=Math.max(...vals); const min=Math.min(0,...vals);
  const X=i=>pad.l+iw*i/(items.length-1);
  const Y=v=>pad.t+ih*(1-(v-min)/(max-min));
  let grid='',ax='';
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4;const y=Y(v);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" class="gridln"/>`;
    grid+=`<text x="${pad.l-8}" y="${y+4}" class="barlabel" text-anchor="end">${pesoC(v)}</text>`;}
  let line=items.map((d,i)=>(i?'L':'M')+X(i)+' '+Y(d.venta)).join(' ');
  let area=`M${X(0)} ${Y(min)} `+items.map((d,i)=>'L'+X(i)+' '+Y(d.venta)).join(' ')+` L${X(items.length-1)} ${Y(min)} Z`;
  let pts='',lbl='';
  items.forEach((d,i)=>{const x=X(i),y=Y(d.venta);
    pts+=`<circle cx="${x}" cy="${y}" r="${i===items.length-1?4:2.5}" fill="var(--accent)"/>`;
    if(i%2===0||i===items.length-1) lbl+=`<text x="${x}" y="${h-12}" class="barlabel" text-anchor="middle">${fdate(d.fecha)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">
    <defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent2)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts}${lbl}
  </svg>`;
}

  // grouped table

    const arr=groups[g].slice().sort((a,b)=>b.venta-a.venta);

    html+=`<tr class="subhead"><td colspan="7">${g}</td></tr>`;
    html+=`<tr class="colrep"><td>Vendedor</td><td>Universo</td><td>CCC</td><td>% Cobertura</td><td>Venta $ (c/IVA)</td><td>Líneas</td><td>Estado</td></tr>`;

      tv+=v.venta;tc+=v.ccc;tu+=v.universo;tl+=v.lineas;

  html+='</tbody></table>';

  // bar chart CCC by vendedor
  const chart=el('div','card');

  p.appendChild(chart);

  // re-sort handler
  enableSort('vtab');
}

    const acc=new Map();

    const out=[]; acc.forEach((val,name)=>{ const o={clientes:val.clientes,venta:val.venta}; if(kind==='familias')o.familia=name; else o.marca=name; out.push(o); });
    out.sort((a,b)=>b.venta-a.venta); return out;
  }
  function draw(){
    const v=sel.value;

    html+='</div><div class="grid g2">';
    html+=`<div class="card"><div class="ctitle"><h2>Venta por marca</h2><span class="hint">${lbl}</span></div>${hbars(mar,{val:x=>x.venta,label:x=>x.marca,color:'var(--accent)',fmt:pesoC,namew:130,w:460})}</div>`;
    html+=`<div class="card"><div class="ctitle"><h2>Marca: clientes, venta y cobertura</h2><span class="hint">${lbl} · sobre universo ${AR.format(uni)}</span></div><div class="twrap"><table><thead><tr><th>Marca</th><th>Clientes</th><th>Venta</th><th>% cobertura</th></tr></thead><tbody>${mar.map(x=>`<tr><td class="name">${x.marca}</td><td class="num">${AR.format(x.clientes!=null?x.clientes:0)}</td><td class="num">${peso(x.venta)}</td><td class="num">${pct(cob(x.clientes))}</td></tr>`).join('')}</tbody></table></div></div>`;
    html+='</div>';
    box.innerHTML=html;
  }
  sel.onchange=draw; draw();
  const tp=el('div','card');tp.appendChild(el('div','ctitle','<h2>Top 25 productos</h2><span class="hint">por venta con IVA · todo el equipo</span>'));

}

    h+='</tbody></table></div>'; card.innerHTML+=h; p.appendChild(card);
  });

  // ---- matriz infaltable x equipo (clientes que lo compraron) ----
  const E=DATA.infaltablesEquipo;
  if(E){
    const vends=Array.isArray(E.vendedores)?E.vendedores:[E.vendedores];

    const card=el('div','card');
    let head='<div class="ctitle"><h2>Infaltables por equipo</h2><span class="hint">en cuántos clientes de cada equipo está presente cada infaltable · color = intensidad por columna</span></div>';
    head+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px"><select id="infEqSel" class="fsel"><option value="SUP">Comparar supervisores</option>';
    sups.forEach(s=>{ head+=`<option value="S:${s}">Equipo ${s}</option>`; });
    head+='</select><select id="infEqSort" class="fsel"><option value="mas">Más colocados primero</option><option value="menos">Menos colocados primero</option><option value="cat">Por categoría</option></select></div><div id="infEqBox"></div>';
    card.innerHTML=head; p.appendChild(card);
    const box=card.querySelector('#infEqBox'), selEq=card.querySelector('#infEqSel'), selSort=card.querySelector('#infEqSort');
    function drawEq(){
      const mode=selEq.value, sort=selSort.value;
      let cols=[];
      if(mode==='SUP'){ cols=sups.map(s=>({label:s, universo:vends.filter(v=>v.supervisor===s).reduce((a,v)=>a+(v.clientes||0),0), cods:vends.filter(v=>v.supervisor===s).map(v=>String(v.cod))})); }

      const val=(r,c)=>{ let t=0; c.cods.forEach(vc=>{ const x=r.v?r.v[vc]:0; if(x)t+=x; }); return t; };
      let rows=det2.map(r=>{ const cells=cols.map(c=>val(r,c)); return {r, cells, tot:cells.reduce((a,b)=>a+b,0)}; });
      if(sort==='mas') rows.sort((a,b)=>b.tot-a.tot);
      else if(sort==='menos') rows.sort((a,b)=>a.tot-b.tot);
      else rows.sort((a,b)=>(a.r.categoria+a.r.descripcion).localeCompare(b.r.categoria+b.r.descripcion));
      const cmax=cols.map((c,ci)=>Math.max(1,...rows.map(x=>x.cells[ci])));
      const heat=(v,ci)=>{ if(!v) return 'color:var(--border)'; const rr=Math.min(1,v/cmax[ci]); const a=(0.12+0.78*rr).toFixed(2); return `background:rgba(var(--accent2-rgb),${a});`+(rr>0.55?'color:#fff;font-weight:700':''); };
      let h='<div class="twrap"><table><thead><tr><th>Categoría</th><th>Infaltable</th><th>Canal</th>';
      cols.forEach(c=>{ h+=`<th class="num">${c.label}<br><span style="font-weight:600;color:var(--muted);font-size:11px">${AR.format(c.universo)} cli</span></th>`; });
      h+='</tr></thead><tbody>';
      rows.forEach(x=>{ h+=`<tr><td class="name">${x.r.categoria}</td><td class="name">${x.r.descripcion}</td><td style="color:var(--muted);font-size:11px">${x.r.canales}</td>`;
        x.cells.forEach((v,ci)=>{ h+=`<td class="num" style="${heat(v,ci)}">${v?AR.format(v):'·'}</td>`; }); h+='</tr>'; });
      const tot=cols.map((c,ci)=>rows.reduce((a,x)=>a+x.cells[ci],0));
      h+='<tr class="total"><td>Total colocaciones</td><td></td><td></td>';
      tot.forEach(t=>{ h+=`<td class="num">${AR.format(t)}</td>`; });
      h+='</tr></tbody></table></div>'; box.innerHTML=h;
    }
    selEq.onchange=drawEq; selSort.onchange=drawEq; drawEq();
  }
}

/* ---------- chart de venta intradia (eje X = hora) ---------- */
function areaChartHHMM(items,{w=980,h=260}={}){
  if(!items || items.length<2){
    return '<div style="padding:26px 10px;text-align:center;color:var(--muted)">Todavía hay pocas actualizaciones del día. El gráfico se va armando solo con cada corrida automática (cada 30 min, de 10:30 a 16:00).</div>';
  }
  const pad={l:70,r:16,t:16,b:34};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=items.map(d=>d.venta); const max=Math.max(...vals,1); const min=Math.min(0,...vals);
  const X=i=>pad.l+iw*i/(items.length-1);
  const Y=v=>pad.t+ih*(1-(v-min)/((max-min)||1));
  let grid='';
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4;const y=Y(v);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" class="gridln"/>`;
    grid+=`<text x="${pad.l-8}" y="${y+4}" class="barlabel" text-anchor="end">${pesoC(v)}</text>`;}
  let line=items.map((d,i)=>(i?'L':'M')+X(i)+' '+Y(d.venta)).join(' ');
  let area=`M${X(0)} ${Y(min)} `+items.map((d,i)=>'L'+X(i)+' '+Y(d.venta)).join(' ')+` L${X(items.length-1)} ${Y(min)} Z`;
  let pts='',lbl='';
  items.forEach((d,i)=>{const x=X(i),y=Y(d.venta);
    pts+=`<circle cx="${x}" cy="${y}" r="${i===items.length-1?4:2.5}" fill="var(--accent)"/>`;
    lbl+=`<text x="${x}" y="${h-12}" class="barlabel" text-anchor="middle">${d.hhmm}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">
    <defs><linearGradient id="agh" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent2)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#agh)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts}${lbl}
  </svg>`;
}

  card.querySelector('#ruPrint').addEventListener('click',()=>{ document.body.classList.add('print-ruta'); setTimeout(()=>{ try{window.print();}catch(e){} setTimeout(()=>document.body.classList.remove('print-ruta'),400); },60); });
  function draw(){

    h+='</tbody></table></div></div>'; box.innerHTML=h;
  }
  ruF.onchange=draw; ruV.onchange=draw; ruFil.onchange=draw; draw();
}

    const V=CM[vc];
    if(!V || !V.clientes || !V.clientes.length){ sumEl.innerHTML=''; box.innerHTML='<div class="card"><p style="color:var(--muted)">Sin ventas de este vendedor en el período.</p></div>'; return; }
    let rows=V.clientes.slice();
    if(sort==='mas') rows.sort((a,b)=>b.nMarcas-a.nMarcas||b.venta-a.venta);
    else if(sort==='menos') rows.sort((a,b)=>a.nMarcas-b.nMarcas||b.venta-a.venta);
    else if(sort==='nombre') rows.sort((a,b)=>a.nombre.localeCompare(b.nombre));
    else rows.sort((a,b)=>b.venta-a.venta);
    const promMarcas=Math.round(10*rows.reduce((a,r)=>a+r.nMarcas,0)/rows.length)/10;

    rows.forEach(r=>{ h+=`<tr><td class="name">${r.nombre}</td><td class="num">${peso(r.venta)}</td><td class="num">${r.nMarcas}</td>`;
      marcas.forEach((m,mi)=>{ const v=r.mk[mi]||0; h+=`<td class="num" style="${heat(v,mi)}">${v?peso(v):'·'}</td>`; }); h+='</tr>'; });
    h+='</tbody></table></div>'; box.innerHTML=h;
  }
  selV.onchange=draw; selSort.onchange=draw; draw();
}

/* ---------- vertical bar chart (efectividad diaria) ---------- */
function vbars(items,{w=980,h=240,val,label,fmt=(x=>x+'%'),color='var(--accent)'}){
  const pad={l:36,r:10,t:16,b:40}; const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...items.map(val),1); const n=items.length;
  const bw=Math.min(38,iw/n*0.7); const step=iw/n;
  let grid='';
  for(let g=0;g<=4;g++){const v=max*g/4;const y=pad.t+ih*(1-g/4);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" class="gridln"/><text x="${pad.l-6}" y="${y+4}" class="barlabel" text-anchor="end">${Math.round(v)}</text>`;}
  let bars='';
  items.forEach((d,i)=>{const v=val(d); const bh=ih*v/max; const x=pad.l+step*i+(step-bw)/2; const y=pad.t+ih-bh;
    const c=typeof color==='function'?color(d):color;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="3" fill="${c}"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-4}" class="barlabel" text-anchor="middle">${v>0?fmt(v):''}</text>`;
    bars+=`<text x="${x+bw/2}" y="${h-24}" class="barlabel" text-anchor="middle">${label(d)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">${grid}${bars}</svg>`;
}

        h+=`<tr><td class="name">${v.nombre}</td><td class="num"><b>${peso(v.ventaBruta)}</b></td><td class="num">${AR.format(v.ccc)}</td><td class="num">${AR.format(v.marcas)}</td><td class="num">${AR.format(v.planificados)}</td><td class="num">${AR.format(v.efectivos)}</td><td class="num" style="text-align:left">${miniBar(v.efectividad,maxVE)}${pct(v.efectividad)}</td><td class="num">${pct(v.cobertura)}</td><td class="num">${cc?AR.format(cc.ritmo):'—'}</td><td><span class="pill ${cls}">${est}</span></td></tr>`;});
      const ep=tp>0?Math.round(1000*te/tp)/10:0; const cb=tu>0?Math.round(1000*tc/tu)/10:0;
      h+=`<tr class="total"><td>Subtotal ${titulo}</td><td class="num">${peso(tb)}</td><td class="num">${AR.format(tc)}</td><td></td><td class="num">${AR.format(tp)}</td><td class="num">${AR.format(te)}</td><td class="num">${pct(ep)}</td><td class="num">${pct(cb)}</td><td></td><td></td></tr>`;
    });
    h+=`<tr class="total"><td>Ventas del día (equipo)</td><td class="num">${peso(k.ventaBruta)}</td><td class="num">${AR.format(k.ccc)}</td><td class="num">${AR.format(k.marcas)}</td><td class="num">${AR.format(k.planificados)}</td><td class="num">${AR.format(k.efectivos)}</td><td class="num">${pct(k.efectividad)}</td><td class="num">${pct(k.cobertura)}</td><td></td><td></td></tr>`;
    h+=`<tr class="total"><td>(−) Devoluciones y N/C del día</td><td class="num" style="color:var(--bad)">${peso(k.devoluciones)}</td><td colspan="8"></td></tr>`;
    h+=`<tr class="grandtotal"><td>VENTA NETA c/IVA (Gerencia)</td><td class="num">${peso(k.venta)}</td><td colspan="8"></td></tr>`;
    h+='</tbody></table></div></div>';
    box.innerHTML=h;
    // ===== BLOQUE 3: Ficha de performance del día =====
    const perf=document.createElement('div'); perf.className='card no-print';
    perf.innerHTML='<div class="ctitle"><h2>Ficha de performance del día</h2><span class="hint">elegí un equipo o un vendedor</span></div>';
    const ps=document.createElement('select'); ps.className='fsel';
    const sset=[...new Set(r.porVendedor.map(v=>v.supervisor))].filter(s=>s.indexOf('N/A')<0);
    sset.sort((a,b)=>{const o=['LUCIA CEJAS','JUAN ARMANDOLA'];const ia=o.indexOf(a),ib=o.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});
    sset.forEach(s=>{const o=document.createElement('option');o.value='T|'+s;o.textContent='▸ Equipo '+s;ps.appendChild(o);});
    sset.forEach(s=>{const og=document.createElement('optgroup');og.label=s;r.porVendedor.filter(v=>v.supervisor===s).sort((a,b)=>b.ventaBruta-a.ventaBruta).forEach(v=>{const o=document.createElement('option');o.value='V|'+v.cod;o.textContent='   '+v.nombre;og.appendChild(o);});ps.appendChild(og);});
    perf.appendChild(ps);
    const pb=document.createElement('div'); pb.style.marginTop='12px'; perf.appendChild(pb);
    box.appendChild(perf);
    function drawPerf(val){
      const tp=val.slice(0,1); const id=val.slice(2); let hh='';
      if(tp==='T'){
        const g=r.porVendedor.filter(v=>v.supervisor===id);
        const sd=r.porSupervisor.find(s=>s.supervisor===id)||{};
        const tb=g.reduce((a,v)=>a+v.ventaBruta,0);
        const mejor=[...g].sort((a,b)=>b.ventaBruta-a.ventaBruta)[0];
        const peor=[...g].sort((a,b)=>a.ventaBruta-b.ventaBruta)[0];
        hh='<div class="ctitle"><h2>Equipo '+id+'</h2><span class="hint">'+g.length+' vendedores · venta real del día</span></div><div class="supgrid">'
          +ftile('Venta del día',peso(tb))
          +ftile('Clientes con compra',AR.format(sd.ccc||0))
          +ftile('Clientes nuevos',AR.format(sd.nuevos||0))
          +ftile('% Efectividad',pct(sd.efectividad||0)+' ('+(sd.efectivos||0)+'/'+(sd.planificados||0)+')')
          +ftile('% Cobertura',pct(sd.cobertura||0))
          +ftile('Mejor venta del día',mejor?mejor.nombre.replace('KAF ','').replace('Kaf ','')+' · '+peso(mejor.ventaBruta)+' · '+AR.format(mejor.ccc)+' cli':'—')
          +ftile('Menor venta del día',peor?peor.nombre.replace('KAF ','').replace('Kaf ','')+' · '+peso(peor.ventaBruta)+' · '+AR.format(peor.ccc)+' cli':'—')
          +'</div>';
      } else {
        const v=r.porVendedor.find(x=>x.cod===id); const cc=conMap[id];
        hh='<div class="ctitle"><h2>'+v.nombre+'</h2><span class="hint">Equipo '+v.supervisor+'</span></div><div class="supgrid">'
          +ftile('Venta del día',peso(v.ventaBruta))
          +ftile('Clientes con compra',AR.format(v.ccc))
          +ftile('Clientes nuevos',AR.format(v.nuevos||0))
          +ftile('Marcas vendidas',AR.format(v.marcas))
          +ftile('A visitar / Efectivos',v.planificados+' / '+v.efectivos)
          +ftile('% Efectividad',pct(v.efectividad))
          +ftile('% Cobertura',pct(v.cobertura))
          +(cc?ftile('Acelerar concurso',AR.format(cc.ritmo)+' cli/día'):'')
          +'</div>';
        if(v.marcaDetalle&&v.marcaDetalle.length){
          hh+='<div class="ctitle" style="margin-top:14px"><h3 style="font-size:14px;font-weight:700">Venta del día por marca (bruta)</h3></div><div class="twrap"><table><thead><tr><th>Marca</th><th>Venta $</th></tr></thead><tbody>';
          v.marcaDetalle.forEach(m=>{hh+='<tr><td class="name">'+m.marca+'</td><td class="num">'+peso(m.venta)+'</td></tr>';});
          hh+='</tbody></table></div>';
        } else { hh+='<div class="note">Sin ventas registradas ese día.</div>'; }
      }
      pb.innerHTML=hh;
    }
    ps.onchange=()=>drawPerf(ps.value); drawPerf(ps.options[0].value);
  }
  sel.onchange=()=>draw(sel.value); draw(fechas[0]);
}

/* ---------- pantalla de contrasena; __app() arranca recien tras descifrar ---------- */
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const E=__ENC;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0e1726;padding:20px';
  ov.innerHTML='<div style="max-width:360px;width:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center">'
   +'<div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7fd7d7;font-weight:700">Comercializadora LP &middot; NEW PGA</div>'
   +'<h2 style="margin:6px 0 4px;color:#e8eef7;font-size:22px">Tablero de Ventas</h2>'
   +'<p style="margin:0 0 16px;color:#9fb0c4;font-size:14px">Ingresa la contrasena para ver el tablero</p>'
   +'<input id="__pw" type="password" autocomplete="current-password" placeholder="Contrasena" style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid #2a3a52;background:#fff;color:#111">'
   +'<button id="__go" style="margin-top:12px;width:100%;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#0e9aa7;color:#fff;cursor:pointer">Entrar</button>'
   +'<div id="__err" style="margin-top:10px;color:#ff8a8a;font-size:13px;height:16px"></div></div>';
  document.body.appendChild(ov);
  const pw=ov.querySelector('#__pw'), go=ov.querySelector('#__go'), err=ov.querySelector('#__err');
  async function tryOpen(){
    err.textContent=''; go.disabled=true; go.textContent='Descifrando...';
    try{
      const enc=new TextEncoder();
      const km=await crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(E.salt),iterations:E.iters,hash:'SHA-256'},km,512);
      const raw=new Uint8Array(bits); const aesKey=raw.slice(0,32), macKey=raw.slice(32,64);
      const iv=b64(E.iv), ct=b64(E.ct), mac=b64(E.mac);
      const hk=await crypto.subtle.importKey('raw',macKey,{name:'HMAC',hash:'SHA-256'},false,['verify']);
      const data=new Uint8Array(iv.length+ct.length); data.set(iv,0); data.set(ct,iv.length);
      const ok=await crypto.subtle.verify('HMAC',hk,mac,data);
      if(!ok) throw new Error('bad');
      const ak=await crypto.subtle.importKey('raw',aesKey,{name:'AES-CBC'},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ak,ct);
      DATA=JSON.parse(new TextDecoder().decode(pt));
      ov.remove(); __app();
    }catch(e){ go.disabled=false; go.textContent='Entrar'; err.textContent='Contrasena incorrecta'; pw.select(); }
  }
  go.addEventListener('click',tryOpen);
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') tryOpen(); });
  pw.focus();
})();
