<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi día · New PGA</title>
<meta name="theme-color" content="#0e1a2b">
<style>
:root{
  --navy:#0a5d6d; --navy2:#0b7285; --teal:#0b7285; --teal2:#12a4bd; --ink:#14202f; --muted:#6b7a8c; --line:#e3e8ef;
  --bg:#eef2f6; --card:#ffffff; --amber:#f0a91b; --amber-soft:#fdf2da;
  --good:#1f9d55; --good-soft:#e3f5ea; --warn:#d99a00; --warn-soft:#fdf3d6; --bad:#d64545; --bad-soft:#fbe6e6;
  --chip:#eef2f7; --track:#e4e9f0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
/* ---- header ---- */
.top{background:linear-gradient(160deg,var(--teal) 0%,var(--teal2) 115%);color:#fff;padding:40px 16px 46px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.logo{font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.logo b{color:#ffd36b}
.logo .pill{display:flex;align-items:center;margin-left:-7px}.logo .pill img{height:42px;display:block;filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.logo img.lp{height:82px;width:82px;margin:-20px -6px -8px 0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.vsel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 10px;font-size:13px;max-width:62%}
.vsel option{color:#111}
.hello{margin:16px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.sub{color:#b7c3d3;font-size:13px;position:relative;z-index:1}
.days{display:flex;gap:6px;margin-top:12px;position:relative;z-index:1}
.days button{flex:1;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.1);color:#e6eef5;cursor:pointer}
.days button[aria-pressed=true]{background:#5d6b78;color:#fff;border-color:#5d6b78;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.days button.today::after{content:"•";margin-left:3px}
/* ---- body ---- */
.sheet{background:var(--bg);border-radius:20px 20px 0 0;margin-top:-28px;position:relative;padding:14px 14px 0}
.sec{margin:18px 2px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec .upd{font-size:11.5px;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,30,50,.06),0 0 0 1px var(--line);margin-bottom:10px}
.lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.faltan{font-size:12px;color:var(--muted);white-space:nowrap}.faltan b{color:var(--ink)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.big small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.mid{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2 .card{overflow-wrap:anywhere}
body{overflow-x:hidden}
.grid2 .card{margin-bottom:0}
.bar{position:relative;height:10px;border-radius:6px;background:var(--track);margin:12px 0 6px;overflow:visible}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.bar .mark span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.msg{font-size:12.5px;margin-top:14px;font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}
.b-good{background:var(--good)}.b-warn{background:var(--amber)}.b-bad{background:var(--bad)}
/* ---- ruta ---- */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding-bottom:2px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
#capas{flex-wrap:wrap;overflow:visible}#capas button{font-size:11.5px;padding:5px 9px}
.cli{padding:12px 14px}
.cli .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.cli .dir{font-size:12px;color:var(--muted);margin-top:2px}
.cli .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.cli .meta b{color:var(--ink);font-weight:700}
.cli.done{opacity:.62}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;font-weight:700;border-radius:7px;padding:3px 8px;background:var(--chip);color:var(--ink)}
.t-red{background:var(--bad-soft);color:#a52b2b}
.t-amber{background:var(--amber-soft);color:#8a5a00}
.t-green{background:var(--good-soft);color:#17703e}
.t-blue{background:#e4eefc;color:#1d4f9a}
.t-pink{background:#fbe7f1;color:#9a2366}
.t-grey{background:var(--chip);color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
/* ---- plegables ---- */
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:10px;transition:transform .2s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card>summary .sm{font-weight:500;font-size:12px;color:var(--muted);margin-left:auto;margin-right:4px}
details.card .in{padding:0 14px 14px}
.lst{display:flex;flex-direction:column;gap:9px}
.li .t{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.li .t b{font-weight:700}
.li .bar{height:7px;margin:5px 0 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.me td{background:var(--amber-soft);font-weight:700}
/* ---- barra inferior ---- */
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.bottom .in{max-width:520px;margin:0 auto}
.bottom .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.bottom .bar{height:6px;margin:6px 0 0}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;min-width:0;border:0;background:var(--chip);border-radius:10px;padding:6px 0 5px;font-size:10px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--amber-soft);color:var(--navy)}
/* ---- supervisor ---- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px}
.alert .ic{font-size:16px;line-height:1.2}
.alert .tx{font-size:13px;line-height:1.4}
.vcard .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vcard .nm{font-weight:800;font-size:15px}
.vcard .ln{font-size:12.5px;color:var(--muted);margin-top:3px}.vcard .ln b{color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mini div{background:var(--bg);border-radius:9px;padding:6px 4px;text-align:center}
.mini .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.mini .v{font-size:14px;font-weight:800;margin-top:1px}
.go{margin-top:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:700;font-size:12.5px;color:var(--navy);cursor:pointer}
/* ---- gate ---- */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--teal) 0%,var(--teal2) 115%);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.gate .box{width:100%;max-width:340px;color:#fff}
.gate h1{font-size:30px;margin:0 0 4px;letter-spacing:-.02em}.gate h1 b{background:#5d6b78;color:#fff;border-radius:9px;padding:0 10px;margin-left:4px;font-size:.85em}
.gate p{color:#eef5f8;margin:6px 0 22px;font-size:19px;font-weight:800}
.gate label{font-size:12px;color:#dbe8ee}
.gate input{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid #2d405c;background:#16263d;color:#fff;font-size:16px}
.gate button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#5d6b78;color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.gate .err{color:#ff9b9b;font-size:13px;min-height:18px;margin-top:10px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
.beta{white-space:nowrap;display:inline-block;font-size:10px;font-weight:800;background:#5d6b78;color:#fff;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.logo .beta{position:absolute;top:-30px;left:50%;transform:translateX(-50%);margin:0;font-size:15px;padding:3px 12px;border-radius:7px;letter-spacing:.02em}
/* ---- Graficos: tarjetas de anillos (inspiradas en Faro360) ---- */
.ncard{min-width:0;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:2px solid var(--ac,#0b7285);box-shadow:0 2px 10px rgba(11,114,133,.08)}
.ncard .nt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ac,#0b7285)}
.ncard .nb{font-size:26px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.01em}
.ncard .ns{font-size:12px;color:var(--muted);margin-top:1px}
.drow{display:flex;align-items:center;gap:14px;margin-top:10px}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px 4px;margin-top:10px;justify-items:center}
.ring{width:58px;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.2}
.ring b{display:block;color:var(--ink);font-weight:700;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{width:100%;border-collapse:collapse;font-size:13px}
.tv th{background:#0b7285;color:#fff;font-weight:700;text-align:left;padding:8px 10px;font-size:12px}
.tv th:last-child,.tv td:last-child{text-align:right}
.tv td{padding:8px 10px;border-bottom:1px solid var(--line)}
.tv tr.eqh td{font-weight:800;background:#eef6f8}
.tv details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.tv details summary::-webkit-details-marker{display:none}
.tv details summary .pm{display:inline-flex;width:18px;height:18px;border:1px solid var(--line);border-radius:4px;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink);flex:0 0 auto}
.tv details summary .pm::before{content:'+'}.tv details[open] summary .pm::before{content:'–'}
.tv details[open] summary .pm{background:#5d6b78;color:#fff;border-color:#5d6b78}
.tv .det{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin:8px 0 2px 26px;font-size:12px;color:var(--muted);text-align:left}
.tv .det b{color:var(--ink)}
.mas{margin-top:10px}.mas summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#6a5acd}
.fsel2{margin-top:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;color:var(--ink)}
.ftab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
.ftab th{font-size:10.5px;color:var(--muted);font-weight:700;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
.ftab td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.pen{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 4px;font-weight:700;font-size:11.5px}
.mtx{overflow-x:auto;margin-top:8px}
.mtx table{border-collapse:separate;border-spacing:3px;font-size:11.5px;width:100%}
.mtx th{font-size:10px;color:var(--muted);font-weight:700;padding:2px;white-space:nowrap}
.mtx td{text-align:center;padding:0}
.mtx td:first-child{text-align:left;font-weight:700;white-space:nowrap;padding-right:6px}
.mtx td:nth-child(2){color:var(--muted)}
.mtx tr[data-fv]{cursor:pointer}.mtx tr.sel td:first-child{color:#6a5acd}
.arow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;padding:5px 0}
.arow .an{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar{height:9px;background:var(--track);border-radius:5px;overflow:hidden}.abar i{display:block;height:100%;border-radius:5px}
.arow .ap{text-align:right;font-size:12.5px;line-height:1.15;min-width:84px}.arow .ap span{display:block;font-size:10.5px;color:var(--muted)}
.oro{border:2px solid #f0a91b;background:linear-gradient(180deg,#fffaf0,#fff)}
.oro3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.oro3 div{background:#fff;border:1px solid #f3dfb0;border-radius:10px;padding:8px;text-align:center}
.oro3 span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.oro3 b{font-size:19px;color:var(--ink)}.oro3 small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.orof{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.orof span{background:#fff;border:1px solid #f3dfb0;border-radius:999px;padding:4px 10px;font-size:12.5px}.orof span.cero{opacity:.55}
.oroln{margin-top:8px;font-size:13px;line-height:1.35}
.oroc{padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}.oroc:last-of-type{border-bottom:0}
.oroc b{display:block;font-size:12.5px}.oroc span{color:var(--muted);font-size:12px}
.orobtn{margin-top:10px;width:100%;border:0;border-radius:11px;padding:11px;background:#0b7285;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.orook{margin-top:10px;background:var(--good-soft);color:#14663a;border-radius:10px;padding:9px 10px;font-size:13px}
.oroq{margin-top:12px;padding-top:10px;border-top:1px dashed #f0d9a4}
.oroqt{font-size:13.5px;font-weight:800;color:#6b4700;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.oroqt span{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#f0a91b;color:#fff;font-size:11.5px;align-items:center;justify-content:center;flex:0 0 auto}
.oropr{margin-top:8px;background:#fff;border:1px solid #f3dfb0;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.orocm{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;font-weight:700;align-items:center;margin-top:4px}
.orocm>div{display:flex;align-items:center;gap:8px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stp button{border:0;background:#eef2f6;width:32px;height:32px;font-size:18px;font-weight:800;cursor:pointer;color:var(--ink)}
.stp b{min-width:34px;text-align:center;font-size:15px}
.antlink{flex:1;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.4);border-radius:9px;padding:7px 8px;font-size:12px;font-weight:700;color:#e6eef5;text-decoration:none;white-space:nowrap}
.grupos{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.grupos button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer}
.grupos button i{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.grupos button b{color:var(--muted);font-weight:700}
.grupos button[aria-pressed=true]{border-color:#0b7285;background:#e9f6f8}
.grupos button[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.oropr summary{cursor:pointer;list-style:none}.oropr summary::-webkit-details-marker{display:none}.oropr summary u{color:#0b7285;text-decoration:underline;white-space:nowrap}
.premio{margin-top:8px;font-size:12.5px;line-height:1.5}.premio table{width:auto;min-width:200px;margin:6px 0;font-size:12.5px}.premio td,.premio th{padding:4px 10px 4px 0}.premio tr.cien td{font-weight:800;color:#14663a}
@media (max-width:360px){.tabs button{font-size:9px;letter-spacing:-.02em}.bottom{padding-left:10px;padding-right:10px}table{font-size:11.5px}td,th{padding:6px 2px}th{letter-spacing:0;font-size:9.5px}}
@media (max-width:420px){.logo img.lp{height:66px;width:66px;margin-top:-18px}.logo .pill img{height:33px}.logo{gap:6px}}
/* PDF del mapa para compartir con el vendedor (Damian 23/11) */
.pdfbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:0 0 10px;padding:10px;border-radius:12px;border:1.5px solid #0d5c6b;background:#fff;color:#0d5c6b;font:700 14px system-ui;cursor:pointer}
#mprint{display:none}
@media print{
  @page{size:A4;margin:9mm}
  body.mprint{background:#fff!important}
  body.mprint nav.bottom,body.mprint .tabs,body.mprint #capas,body.mprint #mdias,body.mprint #mfrec,body.mprint .grupos,body.mprint .days,body.mprint #mvsel,body.mprint #mpdf,body.mprint .grid2,body.mprint .sheet>.note,body.mprint .leaflet-control-zoom,body.mprint .leaflet-control-attribution{display:none!important}
  body.mprint header.top{background:none!important;padding:0 0 6px!important;box-shadow:none!important}
  body.mprint header.top .hello,body.mprint header.top .sub{color:#14202f!important}
  body.mprint .sheet{margin:0!important;padding:0!important;background:#fff!important;border-radius:0!important}
  body.mprint .card{box-shadow:none!important;border:1px solid #dde3ea;break-inside:avoid}
  body.mprint #mprint{display:block}
  #mprint table{width:100%;border-collapse:collapse;font:10px/1.35 system-ui}
  #mprint th{text-align:left;background:#eef2f6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:4px 5px;border-bottom:1px solid #c9d3de}
  #mprint td{padding:3.5px 5px;border-bottom:1px solid #edf0f3;vertical-align:top}
  #mprint tr{break-inside:avoid}
  #mprint h3{font:800 12.5px system-ui;margin:10px 0 4px}
  #mprint .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.mprint .leaflet-container *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="gate" id="gate">
  <div class="box">
    <h1>Mi día <b>3.0</b></h1>
    <p>New PGA · la guía de tu día de venta</p>
    <label for="pw">Clave del tablero</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="go">Entrar</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
/* ===== Tablero 3.0 · piloto "Mi día" del vendedor (16/11/2026) =====
   Version de PRUEBA: no reemplaza al tablero actual. Lee los mismos datos del Worker. */
/* Vista solo-vendedor (18/11, link para Faro 360): ?vendedor en la URL -> solo la pantalla Vendedor, con la clave de vendedores
   y datos recortados por el Worker (/api/vendedor: sin PFP, sin margenes ni gerencia) */
const MODO_VEND = new URLSearchParams(location.search).has('vendedor');
const PW_KEY = MODO_VEND ? 'gpwv' : 'gpw';
const pwHeaders = p => MODO_VEND ? {'X-Vendedor-Password':p,'X-Dashboard-Password':p} : {'X-Dashboard-Password':p};
const WORKER_URL = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? '/api/data' : 'https://tablero-newpga-worker.damian-8ad.workers.dev/api/data').replace('/api/data', MODO_VEND?'/api/vendedor':'/api/data');
let DATA = null;

/* ---------- helpers ---------- */
const AR = new Intl.NumberFormat('es-AR');
const pesoC = n => { n=n||0; const a=Math.abs(n); if(a>=1e6) return '$'+(n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M'; if(a>=1e3) return '$'+Math.round(n/1e3)+'k'; return '$'+Math.round(n); };
const fdate = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = [['Lu','Lunes'],['Ma','Martes'],['Mi','Miércoles'],['Ju','Jueves'],['Vi','Viernes']];
const DOW = {Lu:1,Ma:2,Mi:3,Ju:4,Vi:5};
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(_){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}} };
/* Damian 23/11: el compromiso del Minuto de oro ahora se guarda en el Worker (/api/compromiso), no solo en el celular:
   antes se perdia si el vendedor abria desde otra app/navegador y el supervisor nunca lo veia. */
const COMP = {}; /* fecha -> {cod:{ped,cli,meta,hora,ts}} | 'cargando' */
const compUrl = () => WORKER_URL.replace(/\/api\/(data|vendedor)$/,'/api/compromiso');
/* 24/11: el navegador interno de Faro (Android WebView) puede tener sessionStorage/localStorage apagados: la clave
   tambien queda en memoria al entrar, y todo lo que pega al Worker despues (compromiso, GPS) usa esa. */
let PW_MEM = '';
const compPw = () => { if(PW_MEM) return PW_MEM; try{ return sessionStorage.getItem(PW_KEY)||''; }catch(_){ return ''; } };
const compTxt = o => `${o.hora}: ${o.ped||0} pedidos y ${o.cli||0} clientes nuevos${o.meta?` (${pesoC(o.meta)})`:''}`;
function compCargar(f, force){
  if(!f || (COMP[f] && !force)) return; if(!COMP[f]) COMP[f]='cargando';
  fetch(compUrl()+'?fecha='+f+(force?'&t='+Date.now():''),{headers:pwHeaders(compPw()),cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ COMP[f]=(j&&j.items)||{}; if(DATA) reRender(); }).catch(()=>{ if(COMP[f]==='cargando') delete COMP[f]; });
}
function compGuardar(cod, f, o){
  return fetch(compUrl(),{method:'POST',headers:{...pwHeaders(compPw()),'Content-Type':'application/json'},body:JSON.stringify({cod,fecha:f,...o})})
    .then(r=>r.ok?r.json():null).then(j=>{ if(!j||!j.ok) throw 0; if(typeof COMP[f]!=='object') COMP[f]={}; COMP[f][cod]=j.item; return true; });
}
/* 24/11: sin señal en la calle -> el compromiso queda en cola (en memoria) y se reintenta solo al volver la conexion y cada 2 min */
const COMP_COLA = {};
function compEncolar(cod, f, o){ COMP_COLA[cod+'|'+f]={cod,f,o}; }
function compReintentar(){ Object.entries(COMP_COLA).forEach(([k,x])=>compGuardar(x.cod,x.f,x.o).then(()=>{ delete COMP_COLA[k]; S.compEstado='ok'; if(DATA) reRender(); }).catch(()=>{})); }
window.addEventListener('online', compReintentar);
setInterval(()=>{ if(Object.keys(COMP_COLA).length) compReintentar(); }, 120000);
function compDe(cod, f){ const m=COMP[f]; return m&&typeof m==='object'? m[cod]||null : null; }
function hoyStr(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
/* 20/11 (pedido de los vendedores): despues del cierre del dia el tablero ya planifica el proximo dia habil,
   asi a la tarde/noche pueden ver su Minuto de oro de manana y dejar el compromiso cargado. */
const CIERRE_MIN = 15*60+45;                           /* 15:45 ART: desde ahi se muestra el plan de manana (ultima venta: 15:30) */
const NO_LABORA = ['2026-12-08','2026-12-25'];         /* dias sin salida a la calle (para saltear al buscar el proximo) */
const FERIADOS_SRV = ['2026-11-20','2026-12-08','2026-12-25']; /* los mismos que usa el Worker para contar dias habiles */
function sumaDia(f,n){ const d=new Date(f+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function proxHabil(f){ let d=f; do{ d=sumaDia(d,1); }while([0,6].includes(new Date(d+'T12:00:00Z').getUTCDay())||NO_LABORA.includes(d)); return d; }
/* dia que se esta planificando: hoy hasta las 15:45; despues del cierre (o fin de semana), el proximo dia habil */
function diaPlan(){ const h=hoyStr(), w=new Date(h+'T12:00:00').getDay(); return (w===0||w===6||NO_LABORA.includes(h)||(()=>{ const n=new Date(); return n.getHours()*60+n.getMinutes()>=CIERRE_MIN; })())?proxHabil(h):h; }
function codDia(f){ const w=new Date(f+'T12:00:00').getDay(); return DIAS[(w>=1&&w<=5?w:1)-1][0]; }
/* venta que hay que traer en la fecha f: lo que falta del objetivo repartido en los dias habiles que quedan desde f
   (el Worker lo calcula para el dia de su corrida; si f es posterior se descuentan los dias del medio) */
function restanDesde(f){ const P=DATA.planDia; let n=P.diasRestan; for(let d=P.hoy; d && d<f; d=sumaDia(d,1)){ const w=new Date(d+'T12:00:00Z').getUTCDay(); if(w!==0&&w!==6&&!FERIADOS_SRV.includes(d)) n--; } return Math.max(1,n); }
function metaDia(v,f){ const P=DATA.planDia; if(!P.hoy||f<=P.hoy) return v.hoy; return Math.round(Math.max(0,(v.objetivo||0)-(v.mtd||0))/restanDesde(f)); }
function fechaDeDia(ref,dia){ const d=new Date(ref+'T00:00:00Z'); const iso=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()-(iso-1)+(DOW[dia]-1)); return d.toISOString().slice(0,10); }
function esVisita(fr,pv,fecha){ if(fr!=='Quincenal'&&fr!=='Mensual') return true; if(!pv) return true; const per=fr==='Quincenal'?14:28; const dd=Math.round((new Date(fecha+'T00:00:00Z')-new Date(pv+'T00:00:00Z'))/864e5); return ((dd%per)+per)%per===0; }
const titulo = s => String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
/* "V. 6 ANGELA ECHEVERRIA" / "V. 24 KAF DANIEL SANCHEZ" / "Vendedor 51 Martin" -> "Angela Echeverria" */
const nombreV = s => titulo(String(s||'').replace(/^(V\.|Vendedor|Mayorista)\s*\d+\s*/i,'').replace(/^KAF\s+/i,''));
const limpio = s => String(s==null?'':s).replace(/[� ]+/g,' ').replace(/\s{2,}/g,' ').trim();
/* Semáforo acordado con Damián: 0-79% rojo · 80-99% amarillo · 100%+ verde (sobre la proyección al cierre vs objetivo) */
const sem = r => r>=1?'good':(r>=0.8?'warn':'bad');
const k = c => String(c==null?'':c).trim();

/* ---------- estado ---------- */
const S = { vend:null, dia:null, filtro:'todos', modo:'vend', sup:'Juan' };
const eqDe = g => (g==='KAF'||g==='Lucy') ? 'Lucy' : g;   /* KAF 24-27 + 28 = equipo Lucy */
const SUP = { Juan:{grupo:'Juan', nombre:'JUAN ARMANDOLA'}, Lucy:{grupo:'KAF', nombre:'LUCY CEJAS'} };
const TABS = [['vend','👤','Vendedor'],['sup','👥','Supervisor'],['foc','🎯','Focos'],['dia','📅','Mi día'],['ger','🏢','Gerencia'],['map','🗺️','Mapa']];
/* colores por equipo (paleta categórica validada: slot 1 azul, slot 2 naranja) */
const COL_EQ = {Lucy:'#2a78d6', Juan:'#eb6834', Mayorista:'#6b7a8c'};
const navTabs = () => MODO_VEND ? '' : `<div class="tabs">${TABS.map(([m,i,n])=>`<button data-m="${m}" aria-pressed="${S.modo===m||(m==='ger'&&['his','pfp','gra','alc'].includes(S.modo))}"><span style="display:block;font-size:16px;line-height:1.1">${i}</span>${n}</button>`).join('')}</div>`;
/* logo del encabezado: tocarlo cambia de opcion para probar (texto / New PGA / LP / ambos) */
const LOGOS=['texto','newpga','lp','ambos'];
function LOGO(){ const m=ls.get('v3logo')||'ambos'; const beta='<span class="beta">Tablero 3.0</span>';
  const np='<span class="pill"><img src="logo_newpga.png" alt="New PGA"></span>', lp='<img class="lp" src="logo_lp_linea.png" alt="Comercializadora LP">';
  const inner = m==='texto' ? 'New <b>PGA</b>'+beta : m==='newpga' ? np+beta : m==='lp' ? lp+'<span>New <b>PGA</b></span>'+beta : lp+np+beta;
  return '<div class="logo" title="Tocá para probar otro logo">'+inner+'</div>'; }
document.addEventListener('click',e=>{ if(!e.target.closest('.logo')) return; const m=ls.get('v3logo')||'ambos'; ls.set('v3logo',LOGOS[(LOGOS.indexOf(m)+1)%LOGOS.length]); reRender(); });
function bindTabs(){ document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ S.modo=b.dataset.m; ls.set('v3modo',S.modo); render(); }); }
const barH = (p,s,mark,markLbl)=>`<div class="bar"><div class="fill b-${s}" style="width:${Math.min(100,Math.max(0,p*100)).toFixed(1)}%"></div>${mark!=null?`<div class="mark" style="left:${Math.min(100,mark*100).toFixed(1)}%"><span>${markLbl||''}</span></div>`:''}</div>`;

/* ---------- índices de oportunidades por cliente (de los distintos focos) ---------- */
function indexarFocos(){
  const I = {}; const add=(c,t)=>{ c=k(c); if(!c) return; (I[c]=I[c]||[]).push(t); };
  const cov = DATA.cobertura;
  if(cov&&cov.planes) cov.planes.forEach(pl=>(pl.pendientes||[]).forEach(x=>add(x.cliente,{t:pl.id==='pilas'?'Pilas':'Sachets H&S',c:'t-blue',o:3})));
  const ven = DATA.venus;
  if(ven&&ven.pendientes) ven.pendientes.forEach(x=>{ if(x.comproAntes) add(x.cliente,{t:'Venus',c:'t-pink',o:3}); });
  const fil = DATA.filos;
  if(fil&&fil.pendientes) fil.pendientes.forEach(x=>{ if(x.aUnPaso){ const f=[x.faltaPB3?x.faltaPB3+' PB3':'',x.faltaUG2?x.faltaUG2+' UG2':''].filter(Boolean).join(' + '); add(x.cliente,{t:'Filos: falta '+f,c:'t-amber',o:2}); } });
  const poa = DATA.poa;
  if(poa&&poa.clientes&&poa.porMes&&poa.porMes.length){ const mAct=poa.porMes[poa.porMes.length-1].mes; poa.clientes.forEach(x=>{ if(x.mes===mAct&&x.falta) add(x.c,{t:'Combo Filos: falta '+x.falta,c:'t-amber',o:1}); }); }
  const pfp = DATA.pfp&&DATA.pfp.listas;
  if(pfp&&pfp.surtido){
    const CAT={'AFEITADO Y CUIDADO DE LA BARBA':'Afeitado','CUIDADO DE LA ROPA':'Ropa','CUIDADO DEL BEBE':'Bebé','CUIDADO DEL CABELLO':'Cabello','CUIDADO FEMENINO':'Femenino','CUIDADO ORAL':'Bucal','DESODORANTES':'Desodorantes','PILAS Y BATERIAS':'Pilas'};
    pfp.surtido.forEach(x=>{ if(x.falta&&x.falta.length) add(x.c,{t:'Surtido: '+x.falta.map(f=>CAT[f]||f).join(', '),c:'t-green',o:2}); });
  }
  return I;
}

/* ---------- arranque ---------- */
function start(){
  const P = DATA.planDia;
  const app = document.getElementById('app');
  if(!P){ app.innerHTML='<div class="empty">Todavía no hay datos del plan del día.</div>'; return; }
  window.FOCOS = indexarFocos();
  const guardado = ls.get('v3vend');
  S.vend = (P.vendedores.find(v=>v.cod===guardado)||P.vendedores[0]).cod;
  S.dia = codDia(diaPlan());
  S.modo = MODO_VEND ? 'vend' : 'dia'; /* al ingresar siempre arranca en "Mi día" (pedido de Damián 17/11) */
  /* historial de meses cerrados (julio en adelante), servido por el Worker con la clave; el mes en curso sale en vivo de DATA */
  if(!MODO_VEND) gpsFetch('/api/historial').then(h=>{ window.HIST=h; if(['ger','his','gra'].includes(S.modo)) render(); }).catch(()=>{});
  S.sup = ls.get('v3sup')==='Lucy' ? 'Lucy' : 'Juan';
  render();
}

function render(){
  if(MODO_VEND) S.modo='vend';
  /* si había un mapa abierto, se desarma antes de redibujar (evita errores de la capa de calor sobre un mapa que ya no está) */
  if(window.__map){ try{ window.__map.stop(); window.__map.off(); window.__map.remove(); }catch(_){} window.__map=null; }
  if(S.modo==='sup') return renderSup();
  if(S.modo==='dia') return renderDia();
  if(S.modo==='ger') return renderGer();
  if(S.modo==='foc') return renderFocos();
  if(S.modo==='his') return renderHist();
  if(S.modo==='pfp') return renderPFPMSU();
  if(S.modo==='map') return renderMapa();
  if(S.modo==='gra') return renderGraficos();
  if(S.modo==='alc') return renderAlcance();
  const P = DATA.planDia, app = document.getElementById('app');
  const v = P.vendedores.find(x=>x.cod===S.vend);
  const hoy = hoyStr(), base = diaPlan(), fecha = fechaDeDia(base,S.dia), diaN = DIAS.find(d=>d[0]===S.dia)[1];
  const dowHoy = new Date(base+'T12:00:00').getDay(), maniana = base!==hoy, metaBase = metaDia(v,base);
  const diaBaseN = DIAS.find(d=>d[0]===codDia(base))[1].toLowerCase();
  const transc = Math.max(0,(P.diasMes-P.diasRestan)), esperado = P.diasMes? transc/P.diasMes : 0;
  const mesN = MESES[+P.mes.slice(5,7)-1];

  /* clientes de la ruta del día elegido */
  /* Mayorista (Martín, 51): una sola lista con toda su cartera, sin elegir día (Damián 16/11) */
  const unaLista = v.grupo==='Mayorista';
  const ruta = P.clientes.filter(c=>c.v===v.cod && (unaLista || ((c.d||'').split(' ').includes(S.dia) && esVisita(c.fr,c.pv,fecha))));
  /* GPS del día (solo para hoy): estado de cada cliente según Axum + venta del día */
  const g = fecha===hoy ? gpsVend(v.cod, fecha) : null;
  const est = gpsEstados(g||null);
  const conTags = ruta.map(c=>{
    const tags=[]; const e=est[String(c.c)];
    if(e){ if(e.compro) tags.push({t:`✅ ${e.sinGps?'Pedido sin visita GPS':'Visitado'} · compró ${pesoC(e.venta)}`,c:'t-green',o:-2});
      else if(e.min>=3) tags.push({t:`🟠 Visitado ${e.hora} · ${e.min} min, sin pedido`,c:'t-amber',o:-2});
      else tags.push({t:`Pasó de largo ${e.hora}`,c:'t-grey',o:-2}); }
    else if(c.u===fecha) tags.push({t:'✓ Compró hoy',c:'t-green',o:-1});
    if(esDupKaf(c)) { { const kp=kafPar(c.c); tags.push({t:'🔁 P&G lo atiende el KAF'+(kp&&kp.vend?' ('+kp.vend.split(' ')[0]+')':'')+' · solo Pepsico',c:'t-grey',o:9}); } return {...c, tags, oport:0, hoy:c.u===fecha, dup:true}; }
    if(!(c.m3>0) && !(c.mes>0)) tags.push({t:'No compra P&G: abrir',c:'t-red',o:0});
    else if(!(c.m3>0) && c.mes>0 && c.u!==fecha) tags.push({t:'Cliente nuevo P&G este mes',c:'t-green',o:5});
    const otras = !(c.mes>0) && compraAlgo(c);
    if(otras){ for(let i=tags.length-1;i>=0;i--) if(tags[i].o===0) tags.splice(i,1); tags.unshift({t:(c.m3>0?'Compra otras líneas, P&G no este mes':'Compra otras líneas, P&G nunca'),c:'t-red',o:-0.5}); }
    else if(!(c.mes>0)) tags.push({t:'No compró en '+mesN,c:'t-red',o:0});
    (window.FOCOS[k(c.c)]||[]).forEach(t=>tags.push(t));
    if(c.falta&&c.falta.length) tags.push({t:'Le falta: '+c.falta.slice(0,3).join(', ')+(c.falta.length>3?' +'+(c.falta.length-3):''),c:'t-grey',o:4});
    tags.sort((a,b)=>a.o-b.o);
    const oport = tags.filter(t=>t.o>=0).length;
    return {...c, tags, oport, hoy:c.u===fecha||!!(e&&e.compro), otras, gps:e||null};
  });
  conTags.sort((a,b)=>((a.dup?1:0)-(b.dup?1:0))||(a.hoy-b.hoy)||((a.mes>0)-(b.mes>0))||((b.m3||0)-(a.m3||0))||(b.oport-a.oport));
  const compraronHoy = conTags.filter(c=>c.hoy).length;
  /* resumen GPS de la ruta: cuántos de la ruta ya visitó, con pedido, venta */
  const gpsRes = g ? { pas:conTags.filter(c=>c.gps&&!c.gps.sinGps).length, ent:conTags.filter(c=>c.gps&&c.gps.min>=3).length, ped:conTags.filter(c=>c.gps&&c.gps.compro).length,
      venta:Object.values(est).reduce((s,x)=>s+(x.compro?x.venta:0),0), fuera:(g.puntos||[]).filter(p=>!ruta.some(c=>String(c.c)===String(p.clienteId))).length, k:g.kpis||{}, act:g.actualizado,
      kafN:conTags.filter(c=>c.dup&&c.gps&&c.gps.min>=3).length, kafMin:conTags.filter(c=>c.dup&&c.gps&&c.gps.min>=3).reduce((s,c)=>s+c.gps.min,0) } : null;

  /* KPIs */
  const proyV = v.tend!=null ? v.tend : (esperado>0 ? v.mtd/esperado : 0);
  const rV = v.objetivo ? proyV/v.objetivo : 0, sV = sem(rV);
  const pctV = v.objetivo ? v.mtd/v.objetivo : 0;
  const falta = Math.max(0,v.objetivo-v.mtd);
  const ritmoMsg = pctV>=esperado ? `<span class="c-good">Vas adelante del ritmo (esperado a hoy ${Math.round(esperado*100)}%)</span>`
                                  : `<span class="c-bad">Vas atrás del ritmo (esperado a hoy ${Math.round(esperado*100)}%)</span>`;

  const covs = (DATA.cobertura&&DATA.cobertura.planes||[]).map(pl=>{ const x=pl.porVendedor.find(y=>y.cod===v.cod); if(!x||!x.objetivo) return null; const val=x.meses[P.mes]||0; const pr=esperado>0?val/esperado:val; return {n:pl.id==='pilas'?'Pilas Philco':'Sachets H&S',val,obj:x.objetivo,r:pr/x.objetivo,p:val/x.objetivo}; }).filter(Boolean);

  const cartera = P.clientes.filter(c=>c.v===v.cod && !esDupKaf(c));
  const compradores = cartera.filter(c=>c.mes>0).length;

  const bar = (p,s,mark,markLbl)=>`<div class="bar"><div class="fill b-${s}" style="width:${Math.min(100,Math.max(0,p*100)).toFixed(1)}%"></div>${mark!=null?`<div class="mark" style="left:${Math.min(100,mark*100).toFixed(1)}%"><span>${markLbl}</span></div>`:''}</div>`;

  let h = `
  <header class="top">
    <div class="brand">${LOGO()}
      <select class="vsel" id="vsel">${P.vendedores.map(x=>`<option value="${x.cod}"${x.cod===v.cod?' selected':''}>${x.cod} · ${esc(nombreV(x.nombre))}</option>`).join('')}</select></div>
    <div class="hello">Hola, ${esc(nombreV(v.nombre).split(' ')[0])}</div>
    <div class="sub">${unaLista?`${ruta.length} clientes en tu cartera`:`${diaN} ${fdate(fecha)} · ${ruta.length} clientes en tu ruta`} · quedan ${P.diasRestan} días hábiles</div>
    <div class="days" style="${unaLista?'display:none':''}">${DIAS.map(([c,n],i)=>`<button data-d="${c}" aria-pressed="${c===S.dia}" class="${i+1===dowHoy?'today':''}">${n.slice(0,3)}</button>`).join('')}</div>
  </header>
  <main class="sheet">
    ${fecha===base&&!unaLista?(base.slice(0,7)===P.mes?minutoDeOro(v,conTags,fecha):`<div class="card note">🗓️ El Minuto de oro del ${diaN.toLowerCase()} ${fdate(fecha)} empieza mes nuevo: se arma con la primera actualización del mes.</div>`):''}
    ${!v.objetivo?`<div class="card"><div class="lab">Vendido P&G en ${mesN}</div><div class="big">${pesoC(v.mtd)}</div><div class="note">Sin objetivo asignado este mes.</div></div>`:`
    <div class="card">
      <div class="row"><div class="lab">Objetivo de ${mesN}</div><div class="faltan">te falta <b>${pesoC(falta)}</b></div></div>
      <div class="big">${pesoC(v.mtd)} <small>de ${pesoC(v.objetivo)}</small></div>
      ${bar(pctV,sV,esperado,'hoy: '+Math.round(esperado*100)+'%')}
      <div class="msg">${ritmoMsg}</div>
      <div class="note">Si seguís así cerrás en <b>${pesoC(proyV)}</b> (${Math.round(rV*100)}% del objetivo).</div>
    </div>`}

    <div class="grid2">
      ${v.objetivo?`<div class="card"><div class="lab">${maniana?'El '+diaBaseN+' tenés que traer':'Hoy tenés que traer'}</div><div class="mid">${pesoC(metaBase)}</div><div class="note">ritmo normal ${pesoC(v.ritmoNecesario)}/día</div></div>`:''}

/* ===== Seguimiento de la NO venta (como en la Ficha por Equipo): días sin venta y promedio diario del mes =====
   Día sin venta = venta bruta menor a $20.000 (mismo umbral del tablero actual), incluido hoy.
   Solo días con actividad real en la empresa (CCC > 0), desde el inicio del mes en curso. */
function ventaDiaria(cods){
  const RD=DATA.reporteDiario||{}; const desde=(DATA.kpis&&DATA.kpis.mesDesde)||(DATA.planDia.mes+'-01');
  const fechas=Object.keys(RD).filter(f=>f>=desde&&((RD[f].kpis||{}).ccc||0)>0).sort();
  const serie=fechas.map(f=>({f, v:(RD[f].porVendedor||[]).filter(x=>cods.has(String(x.cod))).reduce((s,r)=>s+(r.ventaBruta||0),0)}));
  const sin=serie.filter(d=>!(d.v>=20000)).length;
  let racha=0; for(let i=serie.length-1;i>=0&&!(serie[i].v>=20000);i--) racha++;
  const tot=serie.reduce((s,d)=>s+d.v,0);
  return {serie, sin, racha, dias:serie.length, prom:serie.length?tot/serie.length:0};
}
/* los dos carteles: grandes, para llamar la atención */

      <div class="note">${d.racha>1?`<b class="c-bad">${d.racha} días seguidos</b> sin venta · `:''}${porVendedor?'días hábiles con':'suma del equipo,'} venta menor a $20.000</div>

/* ===================== EL DÍA (unifica Reporte diario + Venta del Día + Evolución diaria) ===================== */
function svgLinea(series, h){
  /* series: [{pts:[[x,y]], color, dash}] con x = minutos del día, y = $ */
  h=h||150; const W=340, pad=28;
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])), ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  if(!xs.length) return '';
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1, y1=Math.max(...ys,1);
  const X=x=>pad+(x-x0)/((x1-x0)||1)*(W-pad-8), Y=y=>h-20-(y/y1)*(h-34);
  const lab=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  /* una etiqueta por hora, para que no se pisen (ej. 14:30 y 14:35) */
  const ticks=[...new Set(xs)].sort((a,b)=>a-b).filter((t,i,a)=>!a.slice(0,i).some(p=>Math.floor(p/60)===Math.floor(t/60)));
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">
    ${[0.5,1].map(f=>`<line x1="${pad}" x2="${W-8}" y1="${Y(y1*f)}" y2="${Y(y1*f)}" stroke="var(--line)"/><text x="${pad-4}" y="${Y(y1*f)+4}" font-size="9" text-anchor="end" fill="var(--muted)">${pesoC(y1*f).replace(' ','')}</text>`).join('')}
    ${ticks.map(t=>`<text x="${X(t)}" y="${h-5}" font-size="9" text-anchor="middle" fill="var(--muted)">${lab(t)}</text>`).join('')}
    ${series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" ${s.dash?'stroke-dasharray="4 4"':''} points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>${s.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"/>`).join('')}`).join('')}
  </svg>`;
}
function svgBarras(items, sel, h){
  /* items: [{f, v}] barras del mes; la elegida resaltada, roja si es día sin venta */
  h=h||120; const W=340, n=items.length||1, bw=Math.max(4,(W-10)/n-3), mx=Math.max(...items.map(i=>i.v),1);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">
    ${items.map((it,i)=>{ const bh=Math.max(2,(it.v/mx)*(h-22)); const x=5+i*((W-10)/n); const col=it.v<20000?'var(--bad)':(it.f===sel?'var(--navy)':'var(--amber)');
      return `<rect x="${x}" y="${h-16-bh}" width="${bw}" height="${bh}" rx="2" fill="${col}"><title>${fdate(it.f)}: ${pesoC(it.v)}</title></rect><text x="${x+bw/2}" y="${h-4}" font-size="8" text-anchor="middle" fill="var(--muted)">${it.f.slice(8,10)}</text>`; }).join('')}
  </svg>`;
}

/* ===== Dos coberturas (Damián 16/11) =====
   1) contra el UNIVERSO de rutas (todos los clientes activos de las rutas de los vendedores P&G, ~3.004:
      incluye clientes compartidos que solo compran Pepsico u otras líneas) -> cuánto falta abrir.
   2) contra los clientes que COMPRAN P&G (compraron en los ~90 días previos al mes o en el mes) -> cuántos de
      los que suelen comprar ya compraron este mes. Ambas sobre planDia.clientes, cada cliente 1 sola vez. */
/* Duplicados Juan/KAF (16/11): mismo negocio con dos códigos (mismo CUIT). P&G lo vende el KAF, así que en la 3.0
   esos clientes NO cuentan en el universo P&G del vendedor de Juan (el tablero actual no cambia). Lista del Worker. */
const esDupKaf = c => { if(!window.DUPK) window.DUPK=new Set((DATA.planDia.dupKaf||[]).map(String)); const g=(DATA.planDia.vendedores.find(v=>v.cod===c.v)||{}).grupo; return g==='Juan' && window.DUPK.has(String(c.c)); };
/* Clientes que compraron ALGO este mes, de cualquier empresa (Pepsico, Peñaflor, Georgalos, P&G...). Lista del Worker. */
const compraAlgo = c => { if(!window.CMES) window.CMES = DATA.planDia.compraMes ? new Set(DATA.planDia.compraMes.map(String)) : null; return window.CMES ? window.CMES.has(String(c.c)) : null; };
function cobDoble(filtroVend){
  const P=DATA.planDia, ok=new Set(P.vendedores.filter(v=>v.grupo!=='Mayorista'&&(!filtroVend||filtroVend(v))).map(v=>v.cod));
  const u=new Set(), a=new Set(), m=new Set(), cm=new Set();
  P.clientes.forEach(c=>{ if(!ok.has(c.v) || esDupKaf(c)) return; u.add(c.c); if(c.m3>0||c.mes>0) a.add(c.c); if(c.mes>0) m.add(c.c); if(compraAlgo(c)||c.mes>0) cm.add(c.c); });
  const hayCM = !!DATA.planDia.compraMes;
  /* pC = de los clientes que este mes nos compraron algo (cualquier empresa), cuántos compraron P&G */
  return {universo:u.size, activos:a.size, compraron:m.size, compradores:hayCM?cm.size:null, pU:u.size?m.size/u.size:0, pA:a.size?m.size/a.size:0, pC:hayCM&&cm.size?m.size/cm.size:null, otras:hayCM?cm.size-m.size:null};
}
const pct1 = x => (Math.round(x*1000)/10).toLocaleString('es-AR')+'%';

/* ===================== FOCOS DEL MES (una sola pantalla en vez de 5 pestañas) =====================
   Concurso P&G · Filos · Venus · Sachets · Pilas · Combo Filos (POA) · Combos de Gescom · PFP (si hay clave).
   Solo el AVANCE de cada foco: las listas de clientes ya están como etiquetas en la ruta del vendedor. */
function renderFocos(){

  const focos=[];

      v:G.mtd, o:G.objetivo, fmt:pesoC, proy:G.tend, falta:Math.max(0,G.objetivo-G.mtd), porDia:Math.max(0,G.objetivo-G.mtd)/Math.max(1,P.diasRestan), unidad:'' }); }

  /* 2) Filos y 3) Venus: objetivo = promedio de los meses del plan */
  const planMes = (X, ic, extra) => { if(!X) return; const M=X.meta, mo=X.meses.find(m=>m.enCurso)||X.meses[X.meses.length-1];
    const porV=(X.porVendedor||[]).filter(v=>enEqNom(v.supervisor)); const vMes = eq==='Todos'?mo.ccc:porV.reduce((s,v)=>s+((v.meses||{})[mo.mes]||0),0);
    const pend=(X.pendientes||[]).filter(x=>eq==='Todos'||vEq.has(String((P.vendedores.find(v=>nombreV(v.nombre).toUpperCase()===nombreV(x.vendedor).toUpperCase())||{}).cod)));

      equipos: eq==='Todos'?['Lucy','Juan'].map(k=>({k, v:(X.porVendedor||[]).filter(v=>(v.supervisor||'').toUpperCase().startsWith(k.toUpperCase())).reduce((s,v)=>s+((v.meses||{})[mo.mes]||0),0)})):null }); };
  planMes(DATA.filos,'🪒','Autoservicios con 2 PB3 + 1 UG2 en el mes.');
  planMes(DATA.venus,'🌸', DATA.venus&&DATA.venus.stock?`Stock: ${AR.format(DATA.venus.stock.carteles||0)} carteles.`:'');

  /* 4) Sachets y 5) Pilas */

      v, o, fmt:AR.format, proy:esperado>0?Math.round(v/esperado):null, falta:Math.max(0,o-v), porDia:Math.max(0,o-v)/Math.max(1,P.diasRestan), unidad:'clientes',

  /* 6) Combo Filos (POA) */

  app.innerHTML=`

/* ===================== GPS (Axum) =====================
   El recorrido lo sube la PC de Damián cada hora (Axum bloquea a Cloudflare) y el Worker lo cruza con la venta
   del día por cliente. Parada >= 3 min = ENTRÓ (criterio de "Disciplina de ruta"); menos = DE LARGO. */
const GPS = { v:{}, eq:{}, pend:{} };
const RR_BASE = WORKER_URL.replace('/api/data','').replace('/api/vendedor','');
function gpsFetch(path){ const pw=compPw(); return fetch(RR_BASE.replace('/api/vendedor','')+path,{headers:pwHeaders(pw)}).then(r=>r.ok?r.json():null).catch(()=>null); }
/* pide una sola vez por vendedor+fecha y vuelve a dibujar cuando llega */
/* ficha corta del PDV para los carteles del mapa: canal, dias de visita y frecuencia (de la ruta en Gescom) */
const DIAN={Lu:'Lunes',Ma:'Martes',Mi:'Miércoles',Ju:'Jueves',Vi:'Viernes',Sa:'Sábado'};
let __cliIdx=null;
function cliInfo(cod){ if(!__cliIdx||__cliIdx.d!==DATA){ const m={}; (DATA.planDia.clientes||[]).forEach(c=>{ if(!m[c.c]) m[c.c]=c; }); __cliIdx={d:DATA,m}; } return __cliIdx.m[String(cod)]; }
function fichaPDV(cod,fecha){ const c=cliInfo(cod); if(!c) return '<span style="color:#888">No está en la ruta de Gescom</span>';
  const dias=(c.d||'').split(' ').filter(Boolean).map(d=>DIAN[d]||d).join(', ');
  let fuera=''; if(fecha){ const dc=['Do','Lu','Ma','Mi','Ju','Vi','Sa'][new Date(fecha+'T12:00:00').getDay()]; if(c.d&&!(c.d.split(' ').includes(dc))) fuera='<br><span style="color:#b26a00">⚠️ Hoy no es su día de visita</span>'; }
  const kp=kafPar(cod);
  return `${c.sg?'<b>Cliente '+esc(c.sg)+'</b> · ':''}${esc(c.canal||'Sin canal')} · ${esc(c.fr||'Semanal')}${dias?' ('+esc(dias)+')':''}${fuera}${kp?'<br><span style="color:#6a3fb5;font-weight:700">'+kafTxt(kp)+'</span>':''}`; }
/* cliente de la ruta de Juan que en P&G lo atiende el KAF (mismo CUIT): el vendedor va solo por Pepsico */
let __kafIdx=null;

        { const dO=datosTodos.filter(d=>d.v===3).length, dA=datosTodos.filter(d=>d.v===2).length, dN=datosTodos.filter(d=>d.v===1).length;
          expl=`<b>Contra qué mide:</b> clientes de las rutas (sin los que P&G atiende el KAF) que <b>no compraron P&G en ${mesN}</b> (desde el ${fdate((DATA.kpis||{}).mesDesde||'')}). Son <b>${AR.format(datosTodos.length)}</b> de ${AR.format(vivos.length)} con ubicación en el mapa. Tocá los botones de arriba del mapa para prender o apagar cada grupo.
            <div style="margin-top:6px;line-height:1.7"><span style="color:#04163a;font-weight:800">●</span> <b>${AR.format(dO)}</b> nos compraron <b>otras líneas</b> este mes (cualquier empresa), pero P&G no: los más fáciles.<br>
            <span style="color:#2f8fd8;font-weight:800">●</span> <b>${AR.format(dA)}</b> <b>compraban P&G</b> (tienen compra en los últimos 3 meses) y este mes todavía no.<br>
            <span style="color:#9fd8ef;font-weight:800">●</span> <b>${AR.format(dN)}</b> <b>sin P&G en los últimos 3 meses</b> y sin compras de otras líneas este mes.</div>`; } }
      const cols=Object.entries(grad).sort((a,b)=>+a[0]-+b[0]).map(e=>e[1]) /* JS pone la clave '1' primero: ordenar por numero */, qs=datos.map(d=>d.v).sort((a,b)=>a-b);
      /* escala por cuantiles: cada color agrupa una parte parecida de clientes (si no, 3 clientes grandes pintan todo de claro) */
      const nivel = v => capa==='hueco' ? v-1 : nivelCalor(qs,v,cols.length);
      datos.sort((a,b)=>capa==='hueco'?({3:0,1:1,2:2}[a.v]-{3:0,1:1,2:2}[b.v]):a.v-b.v).forEach(({r,v})=>{ const i=Math.min(cols.length-1,Math.max(0,nivel(v))), col=cols[i], rad=3+i*1.1;
        if(capa!=='hueco'&&(S.mapOff||{})[capa+':'+i]) return;
        L.circleMarker([r.lat,r.lon],{radius:rad*2.4,stroke:false,fillColor:col,fillOpacity:0.13,interactive:false}).addTo(map);   /* halo de calor */
        L.circleMarker([r.lat,r.lon],{radius:rad,color:'#fff',weight:1,fillColor:col,fillOpacity:0.95})
          .bindTooltip(`<b>${esc(r.cod)}</b> · ${esc(limpio(r.nombre))}<br>${esc(r.vn)}<br>${fichaPDV(r.cod)}<br>${capa==='hueco'?(r.otras?'Compra otras líneas, P&G no':(r.m3>0?'Compraba P&G hasta hace poco ('+pesoC(r.m3)+'/mes promedio)':'Sin P&G en los últimos 3 meses')):(capa==='venta'?'Venta '+mesN+': <b>'+pesoC(r.mes)+'</b>':'Promedio: <b>'+pesoC(r.m3)+'</b>/mes')+(capa==='venta'&&r.m3>0?'<br>promedio '+pesoC(r.m3)+'/mes':'')}`,{direction:'top'}).addTo(map); });
      ley.innerHTML=`<div class="lab">${esc(titulo)}</div><div style="height:10px;border-radius:6px;margin:8px 0 4px;background:linear-gradient(90deg,${cols.join(',')})"></div><div class="row note" style="margin:0"><span>${capa==='hueco'?'sin P&G 3 meses':'poca venta'}</span><span>${capa==='hueco'?'compra otras líneas':'mucha venta'}</span></div><div class="note">${expl} Pasá el cursor (o tocá) un punto para ver el cliente y su venta. ${AR.format(datos.length)} clientes.</div>`;
    }
    setTimeout(()=>map.invalidateSize(),60);
  }).catch(e=>{ console.error('mapa',e); if(box&&box.isConnected) box.innerHTML='No se pudo cargar el mapa. Revisá la conexión a internet.'; });
}

/* ===================== GRÁFICOS ===================== */
/* barras horizontales (magnitud, una serie) con etiqueta directa; color opcional por entidad (equipo) */
function hbars(items, fmt){ const mx=Math.max(...items.map(i=>Math.abs(i.v)),1); fmt=fmt||pesoC;
  return `<div class="lst">${items.map(i=>`<div class="li" title="${esc(i.l)}: ${fmt(i.v)}"><div class="t"><span>${esc(i.l)}${i.s?` <span class="note">· ${i.s}</span>`:''}</span><b>${fmt(i.v)}</b></div>
    <div class="bar" style="height:9px;margin:5px 0 0"><div class="fill" style="width:${(Math.abs(i.v)/mx*100).toFixed(1)}%;background:${i.c||'var(--amber)'};border-radius:4px"></div></div></div>`).join('')}</div>`; }
/* barras agrupadas por mes, una barra por equipo (misma escala, un solo eje) */
function gbars(meses, series, h){ h=h||170; const W=340, pad=8, n=meses.length, gw=(W-pad*2)/n, bw=Math.min(22,(gw-10)/series.length);
  const mx=Math.max(...series.flatMap(s=>s.vals),1);
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">
    <line x1="${pad}" x2="${W-pad}" y1="${h-18}" y2="${h-18}" stroke="var(--line)"/>
    ${meses.map((m,i)=>{ const x0=pad+i*gw+(gw-bw*series.length-2*(series.length-1))/2;
      return series.map((s,k)=>{ const v=s.vals[i]||0, bh=Math.max(1,v/mx*(h-40)), x=x0+k*(bw+2);
        return `<rect x="${x}" y="${h-18-bh}" width="${bw}" height="${bh}" rx="3" fill="${s.c}"><title>${s.n} · ${m.l}: ${pesoC(v)}</title></rect>`; }).join('')
        + `<text x="${pad+i*gw+gw/2}" y="${h-5}" font-size="10" text-anchor="middle" fill="var(--muted)">${m.l}</text>`; }).join('')}
  </svg><div class="note">${series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:11px;height:11px;border-radius:3px;background:${s.c}"></i>${s.n}</span>`).join('')}</div>`; }
function renderGraficos(){
  const P=DATA.planDia, K=DATA.kpis||{}, app=document.getElementById('app'), RD=DATA.reporteDiario||{}, I=DATA.intradia||{};
  const mesN=MESES[+P.mes.slice(5,7)-1], eq=S.graEq||'Todos', supN={Juan:'JUAN ARMANDOLA',Lucy:'LUCY CEJAS'};
  const enEq=x=>eq==='Todos'||x.supervisor===supN[eq];
  /* 1) venta diaria del mes + acumulado contra el objetivo */
  const desde=(K.mesDesde)||(P.mes+'-01');
  const fechas=Object.keys(RD).filter(f=>f>=desde&&((RD[f].kpis||{}).ccc||0)>0).sort();
  const vDia=f=>{ if(f===I.fecha) return eq==='Todos'?I.venta:(I.porSupervisor||[]).filter(enEq).reduce((s,x)=>s+x.venta,0); const r=RD[f]; return eq==='Todos'?((r.kpis||{}).venta||0):(r.porVendedor||[]).filter(enEq).reduce((s,x)=>s+(x.venta||0),0); };
  const serie=fechas.map(f=>({f,v:vDia(f)}));
  const G = eq==='Todos'?{objetivo:P.llave.meta}:P.grupos[eq==='Lucy'?'KAF':'Juan'];
  let acc=0; const acum=serie.map((d,i)=>[i,(acc+=d.v)]);
  const obj=G?G.objetivo:0, nTot=P.diasMes;
  const W=340,h=170,pad=30, X=i=>pad+i/(nTot-1||1)*(W-pad-10), Y=v=>h-20-v/Math.max(obj,acc,1)*(h-34);
  const lineaAcum=`<svg viewBox="0 0 ${W} ${h}" width="100%" style="display:block">
    <line x1="${pad}" x2="${W-10}" y1="${Y(obj)}" y2="${Y(obj)}" stroke="var(--line)"/><text x="${pad-3}" y="${Y(obj)+3}" font-size="9" text-anchor="end" fill="var(--muted)">${pesoC(obj).replace(' ','')}</text>
    <polyline fill="none" stroke="#9fb0c4" stroke-width="2" stroke-dasharray="4 4" points="${X(0)},${Y(0)} ${X(nTot-1)},${Y(obj)}"/>
    <polyline fill="none" stroke="var(--amber)" stroke-width="2.5" points="${acum.map(([i,v])=>X(i)+','+Y(v)).join(' ')}"/>
    ${acum.map(([i,v])=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--amber)"><title>${fdate(serie[i].f)}: acumulado ${pesoC(v)}</title></circle>`).join('')}
    <text x="${X(acum.length-1)}" y="${Y(acc)-8}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--ink)">${pesoC(acc).replace(' ','')}</text>
    <text x="${pad}" y="${h-5}" font-size="9" fill="var(--muted)">día 1</text><text x="${W-10}" y="${h-5}" font-size="9" text-anchor="end" fill="var(--muted)">día ${nTot}</text>
  </svg><div class="note"><span style="color:var(--amber);font-weight:800">━</span> vendido acumulado · <span style="color:#9fb0c4;font-weight:800">┄</span> ritmo parejo para llegar a ${pesoC(obj)}</div>`;
  /* 2) meses por equipo (historial + mes en curso) */
  const H=window.HIST&&HIST.meses?HIST.meses.filter(m=>m.mes<P.mes):[];
  const MM=[...H.map(m=>({mes:m.mes,sup:m.porSupervisor,cli:m.kpis.ccc,cob:m.kpis.cobertura})),{mes:P.mes,sup:DATA.porSupervisor||[],cli:K.ccc,cob:K.cobertura}];
  const vs=k=>MM.map(m=>((m.sup||[]).find(s=>(s.supervisor||'').toUpperCase().startsWith(k))||{}).venta||0);
  const mesesL=MM.map(m=>({l:MESC(m.mes).slice(0,3)}));
  /* 3) ranking de vendedores (color = equipo) */
  const PV=(DATA.porVendedor||[]).filter(v=>!v.mayorista&&v.supervisor&&!/^N\/A/.test(v.supervisor)&&enEq(v)).sort((a,b)=>b.venta-a.venta);
  const eqDeSup=s=>(s||'').startsWith('LUC')?'Lucy':'Juan';
  /* 4) días sin venta por vendedor */
  const sinV=P.vendedores.filter(v=>v.grupo!=='Mayorista'&&(eq==='Todos'||eqDe(v.grupo)===eq)).map(v=>({v,nv:ventaDiaria(new Set([v.cod]))})).sort((a,b)=>b.nv.sin-a.nv.sin);
  /* 5) familias y canales */
  const fam=eq==='Todos'?(DATA.porFamilia||[]):(((DATA.porEquipoMF||{})[supN[eq]]||{}).familias||[]);
  const can=(DATA.porCanalGrupo||[]);

  app.innerHTML=`
  <header class="top">
    <div class="brand">${LOGO()}<div class="sub">Gerencia</div></div>
    <div class="hello">Gráficos</div>
    <div class="sub">${titulo(mesN)} · datos al ${fdate(DATA.meta&&DATA.meta.ultimaFecha||'')}</div>
    ${gerNav()}
    <div class="days" style="margin-top:8px">${['Todos','Juan','Lucy'].map(k=>`<button data-q="${k}" aria-pressed="${k===eq}">${k==='Todos'?'Toda la empresa':'Equipo '+k}</button>`).join('')}</div>
  </header>
  <main class="sheet">
    ${tableroAnillos(eq)}
    <div class="card"><div class="lab">Vendido acumulado contra el objetivo · ${mesN}</div>${lineaAcum}</div>
    <div class="card"><div class="lab">Venta por día · ${mesN}</div>${svgBarras(serie,null,130)}<div class="note">Rojo = día con menos de $20.000. Promedio ${pesoC(serie.length?serie.reduce((s,d)=>s+d.v,0)/serie.length:0)} por día hábil.</div></div>
    ${eq==='Todos'&&MM.length>1?`<div class="card"><div class="lab">Venta por equipo, mes a mes</div>${gbars(mesesL,[{n:'Equipo Lucy',c:COL_EQ.Lucy,vals:vs('LUC')},{n:'Equipo Juan',c:COL_EQ.Juan,vals:vs('JUAN')}])}<div class="note">${titulo(mesN)} en curso.</div></div>
    <div class="card"><div class="lab">Clientes que compraron P&G, mes a mes</div>${hbars(MM.map(m=>({l:MESC(m.mes),v:m.cli,s:'cob. '+m.cob+'%'})),x=>AR.format(x))}</div>`:''}
    <div class="card"><div class="lab">Venta por vendedor · ${mesN}</div>${hbars(PV.map(v=>({l:nombreV(v.nombre),v:v.venta,c:COL_EQ[eqDeSup(v.supervisor)],s:v.ccc+' cli'})))}
      <div class="note">${eq==='Todos'?Object.entries({Lucy:COL_EQ.Lucy,Juan:COL_EQ.Juan}).map(([k,c])=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="width:11px;height:11px;border-radius:3px;background:${c}"></i>Equipo ${k}</span>`).join(''):''}</div></div>
    <div class="card"><div class="lab">Días sin venta por vendedor · ${mesN}</div>${hbars(sinV.map(x=>({l:nombreV(x.v.nombre),v:x.nv.sin,c:x.nv.sin?'var(--bad)':'var(--good)',s:'de '+x.nv.dias})),x=>AR.format(x))}<div class="note">Días hábiles con menos de $20.000 vendidos.</div></div>
    <div class="card"><div class="lab">Venta por familia${eq==='Todos'?'':' · equipo '+eq}</div>${hbars(fam.slice().sort((a,b)=>b.venta-a.venta).map(f=>({l:RUB[f.familia]||titulo(f.familia),v:f.venta,s:AR.format(f.clientes)+' cli'})))}</div>
    ${eq==='Todos'?`<div class="card"><div class="lab">Venta por canal</div>${hbars(can.map(c=>({l:c.canal,v:c.venta,s:'cob. '+c.cobertura+'%'})))}</div>`:''}
    <div class="note" style="margin:10px 2px 18px">Tocá o pasá el mouse sobre una barra para ver el número exacto.</div>
  </main>
  <nav class="bottom"><div class="in">${navTabs()}</div></nav>`;
  window.scrollTo({top:0}); bindTabs(); bindGerNav();
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ S.graEq=b.dataset.q; render(); });
  document.querySelectorAll('[data-goalc]').forEach(b=>b.onclick=()=>{ S.modo='alc'; S.alcEq=S.graEq||'Todos'; render(); });
  const fv=document.getElementById('famV'); if(fv) fv.onchange=()=>{ S.famV=fv.value; reRender(); };
  document.querySelectorAll('.mtx tr[data-fv]').forEach(tr=>tr.onclick=()=>{ S.famV=S.famV===tr.dataset.fv?'':tr.dataset.fv; reRender(); });
}

/* ---- piezas de la seccion Graficos estilo anillos ---- */
const PAL_CAT=['#0b7285','#f0a91b','#d6457a','#6a5acd','#3fa34d'], PAL_OTROS='#a8b3bf';
function plegar(items,n){ items=items.filter(x=>x.v>0).sort((a,b)=>b.v-a.v); if(items.length<=n+1) return items; const resto=items.slice(n).reduce((s,x)=>s+x.v,0); return [...items.slice(0,n),{l:'Otros',v:resto,c:PAL_OTROS}]; }
function dona(items,size){ size=size||104; const tot=items.reduce((s,x)=>s+x.v,0)||1, r=size/2-9, C=2*Math.PI*r; let off=0;
  const segs=items.map(x=>{ const len=x.v/tot*C, gap=items.length>1?2:0; const el=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${x.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"><title>${x.l}: ${pesoC(x.v)} (${Math.round(x.v/tot*100)}%)</title></circle>`; off+=len; return el; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:0 0 auto">${segs}</svg>`; }
const leyenda=(items)=>{ const tot=items.reduce((s,x)=>s+x.v,0)||1; return `<div class="leg">${items.map(x=>`<span><i style="background:${x.c}"></i>${x.l} ${Math.round(x.v/tot*100)}%</span>`).join('')}</div>`; };
function anillo(frac,txt,col,lab,tip){ const sz=46,r=18,C=2*Math.PI*r,f=Math.max(0,Math.min(1,frac||0));
  return `<div class="ring" title="${tip||''}"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle r="${r}" cx="23" cy="23" fill="none" stroke="var(--track)" stroke-width="5"/><circle r="${r}" cx="23" cy="23" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${f*C} ${C}" transform="rotate(-90 23 23)"/><text x="23" y="26.5" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--ink)">${txt}</text></svg><b>${lab}</b></div>`; }
const SEMC={good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)'};
const coma = x => String(x==null?'—':x).replace('.',',');
const pila = v => nombreV(v.nombre).split(' ')[0];
function tableroAnillos(eq){
  const P=DATA.planDia, K=DATA.kpis||{}, supN={Juan:'JUAN ARMANDOLA',Lucy:'LUCY CEJAS'};
  const vends=P.vendedores.filter(v=>eq==='Todos'||eqDe(v.grupo)===eq);
  const pv=c=>(DATA.porVendedor||[]).find(x=>x.cod===c)||{};
  const transc=K.diasTranscurridos||1, hab=K.diasHabilesMes||P.diasMes||1;
  const G = eq==='Todos'?{objetivo:P.llave.meta,mtd:P.llave.mtd,tend:P.llave.tend}:P.grupos[eq==='Lucy'?'KAF':'Juan'];
  const sp = eq==='Todos'?{}:((DATA.porSupervisor||[]).find(x=>x.supervisor===supN[eq])||{});
  const cd = cobDoble(eq==='Todos'?null:(v=>eqDe(v.grupo)===eq)); /* mismo criterio del 3.0: sin duplicados Juan/KAF */
  const cob = {c:cd.compraron,u:cd.universo,p:Math.round(cd.pU*1000)/10};
  const mg = eq==='Todos'?K.margen:sp.margen;
  const objItems = eq==='Todos'
    ? ['Lucy','Juan','Mayorista'].map(k=>({l:k==='Mayorista'?'Mayoristas':'Equipo '+k,v:P.vendedores.filter(v=>eqDe(v.grupo)===k).reduce((s,v)=>s+(v.objetivo||0),0),c:COL_EQ[k]}))
    : plegar(vends.map(v=>({l:pila(v),v:v.objetivo||0})),4).map((x,i)=>({...x,c:x.c||PAL_CAT[i]}));
  const rVenta = vends.filter(v=>v.objetivo>0).sort((a,b)=>b.pct-a.pct).map(v=>anillo(v.pct,Math.round(v.pct*100)+'%',SEMC[sem(v.tend/v.objetivo)],pila(v),`${nombreV(v.nombre)}: ${pesoC(v.mtd)} de ${pesoC(v.objetivo)} - proyecta ${pesoC(v.tend)}`));
  const rCob = vends.filter(v=>v.grupo!=='Mayorista').map(v=>({v,p:cobDoble(x=>x.cod===v.cod)})).filter(x=>x.p.universo>0).sort((a,b)=>b.p.pU-a.p.pU).map(({v,p})=>anillo(p.pU,Math.round(p.pU*100)+'%',v.objCli?SEMC[sem((v.cliMes||0)/(v.objCli*transc/hab))]:'#0b7285',pila(v),`${nombreV(v.nombre)}: ${p.compraron} de ${p.universo} clientes${v.objCli?' - objetivo '+v.objCli+' clientes':''}`));
  const rMg = vends.map(v=>({v,p:pv(v.cod)})).filter(x=>x.p.margen!=null&&x.p.venta>0).sort((a,b)=>b.p.margen-a.p.margen).map(({v,p})=>anillo(p.margen/30,coma(Math.round(p.margen*10)/10)+'%','#0b7285',pila(v),`${nombreV(v.nombre)}: margen ${coma(p.margen)}% sobre ${pesoC(p.venta)}`));
  const fam = eq==='Todos'?(DATA.porFamilia||[]):(((DATA.porEquipoMF||{})[supN[eq]]||{}).familias||[]);
  const famItems = plegar(fam.map(f=>({l:RUB[f.familia]||titulo(f.familia),v:f.venta})),4).map((x,i)=>({...x,c:x.c||PAL_CAT[i]}));
  const dev=(DATA.devoluciones||[]).map(d=>({l:titulo(String(d.motivo||'').split(',')[0]),v:Math.abs(d.importe||0)}));
  const devItems=plegar(dev,3).map((x,i)=>({...x,c:x.c||['#d64545','#f0a91b','#6a5acd'][i]}));
  const vendido=G.mtd||0;
  return `
  <div class="ncard" style="--ac:#0b7285"><div class="nt">Objetivo del mes</div><div class="nb">$ ${AR.format(Math.round(G.objetivo||0))}</div>
    <div class="ns">${eq==='Todos'?'Toda la empresa':'Equipo '+eq} · ${vends.length} vendedores</div>
    <div class="drow">${dona(objItems)}${leyenda(objItems)}</div></div>
  <div class="ncard" style="--ac:#2a78d6"><div class="nt">Venta del mes</div><div class="nb">$ ${AR.format(Math.round(vendido))}</div>
    <div class="ns">${Math.round(vendido/(G.objetivo||1)*100)}% del objetivo · proyecta ${pesoC(G.tend)} (${Math.round((G.tend||0)/(G.objetivo||1)*100)}%)</div>
    <div class="rings">${rVenta.join('')}</div><div class="note">Anillo = avance contra su objetivo. Color = cómo proyecta el cierre.</div></div>
  <div class="ncard" style="--ac:#eb6834"><div class="nt">Cobertura</div><div class="nb">${coma(cob.p)}%</div>
    <div class="ns">${AR.format(cob.c||0)} clientes con compra de ${AR.format(cob.u||0)} · ${Math.round(cd.pC*100)}% de los que compran cualquier empresa</div>
    <div class="rings">${rCob.join('')}</div><div class="note">Color = clientes con compra contra su objetivo de clientes, al ritmo del mes.</div></div>
  <div class="ncard" style="--ac:#1f9d55"><div class="nt">% Margen</div><div class="nb">${coma(mg)}%</div>
    <div class="ns">Sobre venta neta sin IVA</div>
    <div class="rings">${rMg.join('')}</div></div>
  ${tarjetaFamilias(eq)}
  ${eq==='Todos'&&devItems.length?`<div class="ncard" style="--ac:#d64545"><div class="nt">Devoluciones</div><div class="nb">$ ${AR.format(Math.round(Math.abs(K.devoluciones||0)))}</div>
    <div class="ns">${coma(K.devPct)}% de la venta · ${K.devClientes} clientes</div>

const RUBC={'AFEITADO Y CUIDADO DE LA BARBA':'Afeit.','CUIDADO DEL CABELLO':'Cabello','CUIDADO FEMENINO':'Fem.','CUIDADO DE LA ROPA':'Ropa','CUIDADO ORAL':'Bucal','DESODORANTES':'Desod.','CUIDADO DEL BEBE':'Pañal.','PILAS Y BATERIAS':'Pilas'};
const FAM_ORD=['AFEITADO Y CUIDADO DE LA BARBA','CUIDADO DEL CABELLO','CUIDADO FEMENINO','CUIDADO DE LA ROPA','CUIDADO ORAL','DESODORANTES','CUIDADO DEL BEBE','PILAS Y BATERIAS'];
function famDe(scope){ /* scope: {tipo:'emp'|'eq'|'vend', eq, cod} -> {ccc, fams:[{familia,venta,clientes}]} */
  const K=DATA.kpis||{}, supN={Juan:'JUAN ARMANDOLA',Lucy:'LUCY CEJAS'};
  if(scope.tipo==='vend'){ const f=(DATA.fichas||{})[scope.cod]||{}, pv=(DATA.porVendedor||[]).find(x=>x.cod===scope.cod)||{}; return {ccc:pv.ccc||0, fams:(f.familias||[]).map(x=>({familia:x.familia,venta:x.venta,clientes:x.clientes}))}; }
  if(scope.tipo==='eq'){ const sp=(DATA.porSupervisor||[]).find(x=>x.supervisor===supN[scope.eq])||{}; return {ccc:sp.ccc||0, fams:(((DATA.porEquipoMF||{})[supN[scope.eq]]||{}).familias||[])}; }
  return {ccc:K.ccc||0, fams:DATA.porFamilia||[]}; }
const penCol = p => { const a=Math.max(.06,Math.min(1,p)); return `background:rgba(11,114,133,${(0.08+a*0.82).toFixed(2)});color:${a>0.45?'#fff':'var(--ink)'}`; };
function tarjetaFamilias(eq){

  const d=famDe(sc), tot=d.fams.reduce((s,f)=>s+(f.venta||0),0)||1;
  const fams=d.fams.filter(f=>f.venta>0).sort((a,b)=>b.venta-a.venta);
  const items=plegar(fams.map(f=>({l:RUB[f.familia]||titulo(f.familia),v:f.venta})),4).map((x,i)=>({...x,c:x.c||PAL_CAT[i]}));

  /* detalle por familia: % venta, clientes, penetracion sobre los que compran P&G y cuantos faltan */
  const filas=fams.map(f=>{ const pen=d.ccc?f.clientes/d.ccc:0; return `<tr><td><b>${RUB[f.familia]||titulo(f.familia)}</b></td><td>${Math.round(f.venta/tot*100)}%</td><td>${AR.format(f.clientes)}</td>

  /* matriz vendedor x familia: penetracion de cada familia en los clientes de cada vendedor */
  const cols=FAM_ORD.filter(k=>vends.some(v=>(((DATA.fichas[v.cod]||{}).familias)||[]).some(x=>x.familia===k&&x.venta>0)));

  /* leyenda simple: % de la venta + clientes; y UNA oportunidad: la familia principal con menor penetracion */

  const leg=`<div class="leg" style="flex-direction:column;gap:5px">${items.map(x=>{ const n=cliDe(x.l); return `<span><i style="background:${x.c}"></i><b>${x.l}</b> ${Math.round(x.v/tot*100)}%${n!=null?` <span style="color:var(--muted)">· ${AR.format(n)} cli.</span>`:''}</span>`; }).join('')}</div>`;
  const op=fams.slice(0,4).map(f=>({f,pen:d.ccc?f.clientes/d.ccc:0})).sort((a,b)=>a.pen-b.pen)[0];
  return `<div class="ncard" style="--ac:#6a5acd"><div class="nt">Venta por familia · ${esc(quien)}</div>

    <div class="drow">${dona(items)}${leg}</div>
    ${op&&d.ccc>op.f.clientes?`<div class="tag" style="margin-top:12px;display:block;background:#f1ebfb;color:#4a2b80;padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.4">💡 <b>Para sumar: ${RUB[op.f.familia]||titulo(op.f.familia)}.</b> ${AR.format(d.ccc-op.f.clientes)} de los ${AR.format(d.ccc)} clientes que compran P&G todavía no la llevan.</div>`:''}
    <button class="go" data-goalc="1">🎯 Ver penetración por vendedor en Alcance →</button></div>`;
}

  /* hoy: último día del reporte diario */
  const RD = DATA.reporteDiario||{}; const fHoy = Object.keys(RD).sort().pop();

  const hhmm = DATA.intradia&&DATA.intradia.fecha===fHoy ? DATA.intradia.hhmm : null;

  const efV = {}; ((DATA.efectividad||{}).porVendedor||[]).forEach(e=>efV[String(e.cod)]=e);
  const pvV = {}; (DATA.porVendedor||[]).forEach(e=>pvV[String(e.cod)]=e);
  const planes = (DATA.cobertura&&DATA.cobertura.planes)||[];
  const covV = cod => planes.map(pl=>{ const x=pl.porVendedor.find(y=>y.cod===cod); return x&&x.objetivo?{n:pl.id==='pilas'?'Pilas':'Sachets',v:x.meses[P.mes]||0,o:x.objetivo}:null; }).filter(Boolean);

  /* GPS de hoy del equipo (Disciplina de ruta) */
  const gpsEq = gpsEquipo(hoyStr());
  const gpsEqRows = gpsEq ? (gpsEq.porVendedor||[]).filter(x=>cods.has(String(x.cod))) : [];
  const gpsT = gpsEqRows.reduce((a,x)=>({paso:a.paso+(x.paso||0), entro:a.entro+(x.entro||0), ped:a.ped+(x.conPedido||0), venta:a.venta+(x.ventaCalle||0)}),{paso:0,entro:0,ped:0,venta:0});
  const gpsNoSal = gpsEq ? (gpsEq.noSalieron||[]).filter(x=>cods.has(String(x.cod))) : [];
  const filas = vends.map(v=>{
    const proy = v.tend!=null ? v.tend : (esperado>0? v.mtd/esperado : 0);
    const r = v.objetivo ? proy/v.objetivo : 0;
    return { v, r, pct:v.objetivo? v.mtd/v.objetivo:0, hoy:rdV[v.cod]||null, ef:efV[v.cod]||null, pv:pvV[v.cod]||null, cov:covV(v.cod), nv:ventaDiaria(new Set([v.cod])), cd:cobDoble(x=>x.cod===v.cod) };
  }).sort((a,b)=>a.r-b.r);

  /* ---- dónde actuar: alertas armadas solas ---- */
  const al = [];
  filas.filter(f=>f.nv.racha>=2).forEach(f=>al.push({ic:'⛔', o:-1, t:`<b>${esc(nombreV(f.v.nombre))}</b> lleva <b>${f.nv.racha} días hábiles seguidos sin venta</b> (${f.nv.sin} en el mes).`}));
  filas.filter(f=>f.v.objetivo && f.r<0.8).forEach(f=>al.push({ic:'🔴', o:0, t:`<b>${esc(nombreV(f.v.nombre))}</b> proyecta cerrar al <b>${Math.round(f.r*100)}%</b> del objetivo. Necesita <b>${pesoC(f.v.hoy)}/día</b> (su ritmo normal es ${pesoC(f.v.ritmoNecesario)}).`}));
  filas.forEach(f=>{ const sin=f.cov.filter(c=>c.v===0).map(c=>c.n); if(sin.length) al.push({ic:'🟠', o:1, t:`<b>${esc(nombreV(f.v.nombre))}</b> todavía no tiene clientes de <b>${sin.join(' ni ')}</b> este mes (sin eso cobra el 50% del premio).`}); });
  if(fHoy===hoyStr()) filas.forEach(f=>{ const h=f.hoy; if(h&&h.planificados>=10&&h.efectivos/h.planificados<0.1) al.push({ic:'🟡', o:2, t:`<b>${esc(nombreV(f.v.nombre))}</b>: hoy compraron ${h.efectivos} de ${h.planificados} clientes de su ruta.`}); });
  al.sort((a,b)=>a.o-b.o);

  /* clientes grandes del equipo que no compraron en el mes */
  const grandes = P.clientes.filter(c=>cods.has(c.v) && !esDupKaf(c) && c.m3>0 && !(c.mes>0)).sort((a,b)=>b.m3-a.m3);
  const sumGr = grandes.slice(0,20).reduce((s,c)=>s+c.m3,0);

  const covEq = planes.map(pl=>{ const mo=pl.meses.find(m=>m.enCurso)||pl.meses[0]||{}; const o=(pl.equipos[S.sup]||{}).total||0; const val=(mo.porEquipo||{})[S.sup]||0; return {n:pl.id==='pilas'?'Pilas Philco':'Sachets H&S',val,o,r:o?(esperado>0?val/esperado:val)/o:0,p:o?val/o:0}; }).filter(c=>c.o);

  const rG = G.objetivo ? (G.tend||0)/G.objetivo : 0, pG = G.objetivo ? G.mtd/G.objetivo : 0;
  const mini = (k,v,cls)=>`<div><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;

    </div>
    <div class="grid2">
      <div class="card"><div class="lab">Hoy${hhmm?' · '+hhmm+'hs':''}</div><div class="mid">${pesoC(hoyAgg.venta)}</div><div class="note">${fHoy?'ventas del '+fdate(fHoy):''}</div></div>
      <div class="card"><div class="lab">Compraron hoy</div><div class="mid">${hoyAgg.ef} <small style="font-size:13px;color:var(--muted);font-weight:600">de ${hoyAgg.pl}</small></div><div class="note">clientes de la ruta (${hoyAgg.pl?Math.round(hoyAgg.ef/hoyAgg.pl*100):0}%)</div></div>

    ${covEq.length?`<div class="grid2" style="margin-top:10px">${covEq.map(c=>`<div class="card"><div class="lab">${c.n}</div><div class="mid c-${sem(c.r)}">${c.val} <small style="font-size:13px;color:var(--muted);font-weight:600">de ${c.o}</small></div>${barH(c.p,sem(c.r),esperado,'')}<div class="note">clientes del equipo en ${mesN}</div></div>`).join('')}</div>`:''}

    <div class="sec"><h2>Dónde actuar</h2><span class="upd">${al.length} avisos</span></div>
    ${al.length? al.slice(0,6).map(a=>`<div class="card alert"><span class="ic">${a.ic}</span><span class="tx">${a.t}</span></div>`).join('') + (al.length>6?`<details class="card"><summary>Ver ${al.length-6} avisos más</summary><div class="in">${al.slice(6).map(a=>`<div class="alert" style="padding:6px 0"><span class="ic">${a.ic}</span><span class="tx">${a.t}</span></div>`).join('')}</div></details>`:'') : '<div class="card empty">Sin avisos: el equipo viene bien. 👏</div>'}

    ${gpsEq?`<div class="card">

    ${filas.map(f=>{ const v=f.v, h=f.hoy, s=sem(f.r);
