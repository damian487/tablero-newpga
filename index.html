        <div class="ln"><b>${pesoC(v.mtd)}</b>${v.objetivo?` de ${pesoC(v.objetivo)}`:''} · hoy <b>${h?pesoC(h.venta):'—'}</b>${h?` (${h.efectivos}/${h.planificados} compraron)`:''}</div>
        ${v.objetivo?barH(f.pct,s,esperado,''):''}
        ${compOk?(()=>{ const c=compDe(v.cod,fComp); return `<div class="note" style="margin-top:10px;border-radius:9px;padding:7px 9px;background:${c?'#eaf6ec':'#fdf0e6'}">${c?`🤝 Se comprometió (${esc(c.hora)}): <b>${c.ped} pedidos</b> y <b>${c.cli} clientes nuevos</b>${c.meta?' para traer '+pesoC(c.meta):''}`:'🤝 Todavía no cargó su compromiso del Minuto de oro'}</div>`; })():''}
        ${(()=>{ const cs=new Map(); DATA.planDia.clientes.forEach(c=>{ if(c.v===v.cod&&esDupKaf(c)) cs.set(c.c,c); }); const au=[...cs.values()].filter(c=>/autoservicio/i.test(c.canal||'')).length;
          return cs.size?`<div class="note" style="margin-top:10px;background:#f1ebfb;color:#5b3596;border-radius:9px;padding:7px 9px">🔁 <b>${cs.size}</b> clientes de su ruta (${au} autoservicios) los atiende el KAF en P&G: los visita solo por Pepsico</div>`:''; })()}
        ${gv?(()=>{ const gg=gpsVend(v.cod,hoyStr()), x=gg?rutaSplit(v.cod,gg):null;
          if(!x||!x.ruta) return `<div class="note" style="margin-top:12px;background:var(--bg);border-radius:9px;padding:7px 9px">🛰️ Hoy: pasó <b>${gv.paso}</b> (de ${gv.cartera} de su ruta) · entró <b>${gv.entro}</b> · <b>${gv.conPedido} con pedido</b>${gv.ventaCalle?' · '+pesoC(gv.ventaCalle):''} · salió ${horaDe(gv.arranque)}${gv.sinVisita?` · <span class="c-bad">${gv.sinVisita} de la ruta sin visitar</span>`:''}</div>`;
          const s2=x.efect>=0.5?'good':(x.efect>=0.25?'warn':'bad');
          return `<div class="note" style="margin-top:12px;background:var(--bg);border-radius:9px;padding:7px 9px;line-height:1.6">🛰️ <b>Ruta de hoy: ${x.ruta}</b> · pasó ${x.pasoR} · entró ${x.entR} · <b>${x.pedR} con pedido</b> → efectividad <b class="c-${s2}">${Math.round(x.efect*100)}%</b>${x.sinVisita?` · <span class="c-bad">${x.sinVisita} sin visitar</span>`:''}<br>
            ↪️ Fuera de ruta: ${x.fuera} (entró ${x.entF}${x.pedF?`, ${x.pedF} con pedido`:''}) · salió ${horaDe(gv.arranque)}${gv.ventaCalle?' · '+pesoC(gv.ventaCalle)+' en calle':''}${x.ruta&&!x.pasoR&&x.fuera?' · <span class="c-bad">⚠️ hoy no pasó por su ruta del día</span>':''}</div>`; })():''}
        ${f.nv.dias?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
          <span class="tag ${f.nv.sin?'t-red':'t-green'}" style="font-size:12.5px;padding:5px 10px">${f.nv.sin?'⛔':'✓'} ${f.nv.sin} ${f.nv.sin===1?'día':'días'} sin venta de ${f.nv.dias}${f.nv.racha>1?' · '+f.nv.racha+' seguidos':''}</span>
          <span class="tag t-amber" style="font-size:12.5px;padding:5px 10px">Promedio ${pesoC(f.nv.prom)}/día</span></div>`:''}
        <div class="mini">
          ${f.cov.map(c=>mini(c.n,`${c.v}/${c.o}`,c.v>=c.o?'c-good':(c.v===0?'c-bad':'c-warn'))).join('')}
          ${mini('Efect. mes',efm)}
          ${f.cd.pC!=null?mini('P&G / compran',Math.round(f.cd.pC*100)+'%'):mini('Compran P&G',Math.round(f.cd.pA*100)+'%')}
        </div>
        <button class="go" data-v="${v.cod}">Ver su día →</button>
      </div>`; }).join('')}

    <div class="sec"><h2>Ver detalle</h2></div>
    <details class="card"><summary>Clientes grandes sin compra en ${mesN} <span class="sm">${grandes.length}</span></summary><div class="in">
      <div class="note" style="margin:0 0 8px">Los 20 primeros compran en promedio <b>${pesoC(sumGr)}</b> por mes entre todos.</div>
      <table><thead><tr><th>Cliente</th><th>Vendedor</th><th class="n">Prom./mes</th></tr></thead><tbody>
      ${grandes.slice(0,20).map(c=>`<tr><td><b>${esc(limpio(c.rs))}</b><div class="note" style="margin:1px 0 0">${esc(c.canal||'')} · últ. ${c.u?fdate(c.u):'+90 días'}</div></td><td>${esc(nombreV((P.vendedores.find(x=>x.cod===c.v)||{}).nombre).split(' ')[0])}</td><td class="n">${pesoC(c.m3)}</td></tr>`).join('')}
      </tbody></table></div></details>
    <details class="card"><summary>Ficha del equipo <span class="sm">venta, cobertura, efectividad</span></summary><div class="in"><table>
      <thead><tr><th>Vendedor</th><th class="n">Vendido</th><th class="n">% obj.</th><th class="n">Sin venta</th><th class="n">Prom./día</th></tr></thead><tbody>
      ${filas.slice().sort((a,b)=>b.v.mtd-a.v.mtd).map(f=>`<tr><td>${esc(nombreV(f.v.nombre))}</td><td class="n">${pesoC(f.v.mtd)}</td><td class="n c-${sem(f.r)}">${f.v.objetivo?Math.round(f.pct*100)+'%':'—'}</td><td class="n ${f.nv.sin?'c-bad':'c-good'}"><b>${f.nv.sin}</b>/${f.nv.dias}</td><td class="n">${pesoC(f.nv.prom)}</td></tr>`).join('')}
      </tbody></table><div class="note">Sin venta = días hábiles del mes con venta menor a $20.000. Prom./día = venta del mes ÷ días hábiles transcurridos.</div></div></details>
    ${detalleMixEquipo(sup.nombre)}
    <div class="note" style="margin:10px 2px 18px">Versión de prueba del Tablero 3.0. Datos al ${fdate(DATA.meta&&DATA.meta.ultimaFecha||'')}.</div>
  </main>
  <nav class="bottom"><div class="in">${navTabs()}</div></nav>`;
  window.scrollTo({top:0});
  bindTabs();
  document.getElementById('ssel').onchange = e=>{ S.sup=e.target.value; ls.set('v3sup',S.sup); render(); };
  document.querySelectorAll('.go').forEach(b=>b.onclick=()=>{ S.vend=b.dataset.v; S.modo='vend'; ls.set('v3vend',S.vend); ls.set('v3modo','vend'); render(); });
}
function detalleMixEquipo(supNombre){
  const M=(DATA.porEquipoMF||{})[supNombre]; if(!M||!M.familias) return '';
  const fs=M.familias.slice().sort((a,b)=>b.venta-a.venta), mx=Math.max(...fs.map(f=>f.venta),1);
  const CAT={'AFEITADO Y CUIDADO DE LA BARBA':'Afeitado','CUIDADO DE LA ROPA':'Ropa','CUIDADO DEL BEBE':'Pañales','CUIDADO DEL CABELLO':'Cabello','CUIDADO FEMENINO':'Femenino','CUIDADO ORAL':'Bucal','DESODORANTES':'Desodorantes','PILAS Y BATERIAS':'Pilas'};
  return `<details class="card"><summary>Mix por familia del equipo <span class="sm">${fs.length}</span></summary><div class="in"><div class="lst">
    ${fs.map(f=>`<div class="li"><div class="t"><span>${esc(CAT[f.familia]||titulo(f.familia))} <span class="note">· ${AR.format(f.clientes)} clientes</span></span><b>${pesoC(f.venta)}</b></div>${barH(f.venta/mx,'warn',null)}</div>`).join('')}
  </div></div></details>`;
}

function detalleFamilias(v,P){
  const fs=(v.familias||[]).slice().sort((a,b)=>b.hoy-a.hoy); if(!fs.length) return '';
  return `<details class="card"><summary>Qué vender hoy, por familia <span class="sm">${fs.length}</span></summary><div class="in"><table>
    <thead><tr><th>Familia</th><th class="n">Hoy</th><th class="n">En el mes</th></tr></thead><tbody>
    ${fs.map(f=>{ const st=(P.stock||[]).find(s=>s.familia===f.familia)||{}; return `<tr><td><b>${esc(f.familia)}</b>${st.acciones?`<div class="note" style="margin-top:2px">${esc(st.acciones)}</div>`:''}${st.factor<1?'<div class="note c-bad">stock limitado</div>':''}</td><td class="n"><b>${pesoC(f.hoy)}</b></td><td class="n">${pesoC(f.mtd)}</td></tr>`; }).join('')}
    </tbody></table></div></details>`;
}
function detalleStock(P){
  const st=(P.stock||[]).slice().sort((a,b)=>b.stock-a.stock), q=P.quiebres||[];
  return `<details class="card"><summary>Stock y quiebres <span class="sm">${q.length} en quiebre</span></summary><div class="in">
    <div class="lst">${st.map(s=>`<div class="li"><div class="t"><span>${esc(s.familia)}</span><b>${pesoC(s.stock)}</b></div></div>`).join('')}</div>
    ${q.length?`<div class="lab" style="margin:14px 0 6px">No ofrecer (en quiebre)</div><div class="note" style="line-height:1.6">${q.map(x=>esc(x.desc)).join(' · ')}</div>`:''}
  </div></details>`;
}
function detalleRanking(v,P){
  const eq=g=>(g==='KAF'||g==='Lucy')?'Lucy':g;  /* KAF 24-27 + 28 = equipo Lucy */
  const grp=P.vendedores.filter(x=>eq(x.grupo)===eq(v.grupo)).slice().sort((a,b)=>(b.pct||0)-(a.pct||0));
  return `<details class="card"><summary>Ranking de mi equipo <span class="sm">Equipo ${esc(eq(v.grupo))}</span></summary><div class="in"><table>
    <thead><tr><th>#</th><th>Vendedor</th><th class="n">Vendido</th><th class="n">%</th></tr></thead><tbody>
    ${grp.map((x,i)=>`<tr class="${x.cod===v.cod?'me':''}"><td>${i+1}</td><td>${esc(nombreV(x.nombre))}</td><td class="n">${pesoC(x.mtd)}</td><td class="n c-${sem(x.tend&&x.objetivo?x.tend/x.objetivo:0)}">${Math.round((x.pct||0)*100)}%</td></tr>`).join('')}
    </tbody></table><div class="note">Color según la proyección al cierre contra el objetivo.</div></div></details>`;
}

/* ---------- clave ---------- */
(function(){
  const gate=document.getElementById('gate'), pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');
  async function abrir(p,silent){
    if(!silent){ err.textContent=''; go.disabled=true; go.textContent='Cargando…'; }
    try{
      const r=await fetch(WORKER_URL,{headers:pwHeaders(p)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      DATA=await r.json(); PW_MEM=p;
      try{sessionStorage.setItem(PW_KEY,p);}catch(_){}
      gate.remove(); start(); autoRefresco(p);
    }catch(e){
      try{sessionStorage.removeItem(PW_KEY);}catch(_){}
      gate.style.visibility='visible'; go.disabled=false; go.textContent='Entrar';
      if(!silent) err.textContent='Clave incorrecta o sin conexión'; console.error(e);
    }
  }
  /* 19/11: la página traía los datos una sola vez al abrir; si quedaba abierta no veía las corridas
     siguientes. Ahora vuelve a pedirlos cada 10 min y al volver a la pestaña (el Worker los cachea 90s,
     casi no suma lecturas de KV) y solo redibuja si cambiaron, sin pisar algo que se esté escribiendo. */
  function autoRefresco(p){
    let ultimo=Date.now(), pendiente=false, dia0=diaPlan();
    /* 20/11: si la pagina quedo abierta de un dia para el otro, pasar sola al dia de hoy (el Minuto de oro solo se arma para hoy) */
    const cambioDeDia=()=>{ if(diaPlan()===dia0) return false; dia0=diaPlan(); S.dia=codDia(dia0); S.oro=null; redibujar(); traer(); return true; };
    const firma=d=>JSON.stringify([d.meta&&d.meta.generado,d.intradia&&d.intradia.hhmm,d.intradia&&d.intradia.venta,d.planDia&&d.planDia.generado]);
    const redibujar=()=>{ const a=document.activeElement; if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ pendiente=true; return; } pendiente=false; window.FOCOS=indexarFocos(); render(); };
    async function traer(){
      ultimo=Date.now();
      try{ const r=await fetch(WORKER_URL,{headers:pwHeaders(p),cache:'no-store'}); if(!r.ok) return; const d=await r.json();
        if(firma(d)!==firma(DATA)){ DATA=d; redibujar(); } }catch(_){}
    }
    setInterval(()=>{ if(!document.hidden) traer(); else if(pendiente) redibujar(); }, 10*60000);
    setInterval(()=>{ if(!document.hidden) cambioDeDia(); }, 60000);
    const alVolver=()=>{ if(document.hidden) return; if(!cambioDeDia() && Date.now()-ultimo>3*60000) traer(); };
    document.addEventListener('visibilitychange',alVolver); window.addEventListener('focus',alVolver); window.addEventListener('pageshow',alVolver);
    document.addEventListener('focusout',()=>{ if(pendiente) setTimeout(redibujar,300); });
  }
  go.onclick=()=>abrir(pw.value); pw.onkeydown=e=>{ if(e.key==='Enter') abrir(pw.value); };
  let sv=null; try{sv=sessionStorage.getItem(PW_KEY);}catch(_){}
  if(MODO_VEND){ const lb=document.querySelector('label[for=pw]'); if(lb) lb.textContent='Clave de vendedores'; }
  if(sv){ gate.style.visibility='hidden'; abrir(sv,true); } else pw.focus();
})();
</script>
