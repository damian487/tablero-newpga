<title>Tablero de Ventas — NEW PGA · Comercializadora LP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ground:#eef1f5; --surface:#ffffff; --surface2:#f6f8fb; --ink:#16202e; --muted:#5c6b80;
  --border:#dde3ec; --accent:#0b7285; --accent2:#12a4bd; --accent-soft:#e2f2f5;
  --good:#17915c; --good-soft:#e3f3ec; --warn:#b3790f; --warn-soft:#f8efd8; --warn2:#e8890c;
  --bad:#c0442e; --bad-soft:#f8e6e2; --accent2-rgb:18,164,189;
  --shadow:0 1px 2px rgba(20,32,46,.04),0 3px 10px rgba(20,32,46,.05);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0d1219; --surface:#151d28; --surface2:#1b2530; --ink:#e6edf5; --muted:#93a2b6;
    --border:#26303d; --accent:#19a2b8; --accent2:#38c5da; --accent-soft:#123038;
    --good:#33b57e; --good-soft:#12291f; --warn:#d99f2b; --warn-soft:#2b2413; --warn2:#f2973a; --bad:#e26a52; --bad-soft:#2e1a15; --accent2-rgb:56,197,218;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1219; --surface:#151d28; --surface2:#1b2530; --ink:#e6edf5; --muted:#93a2b6;
  --border:#26303d; --accent:#19a2b8; --accent2:#38c5da; --accent-soft:#123038;
  --good:#33b57e; --good-soft:#12291f; --warn:#d99f2b; --warn-soft:#2b2413; --warn2:#f2973a; --bad:#e26a52; --bad-soft:#2e1a15; --accent2-rgb:56,197,218;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --ground:#eef1f5; --surface:#ffffff; --surface2:#f6f8fb; --ink:#16202e; --muted:#5c6b80;
  --border:#dde3ec; --accent:#0b7285; --accent2:#12a4bd; --accent-soft:#e2f2f5;
  --good:#17915c; --good-soft:#e3f3ec; --warn:#b3790f; --warn-soft:#f8efd8; --warn2:#e8890c; --bad:#c0442e; --bad-soft:#f8e6e2; --accent2-rgb:18,164,189;
  --shadow:0 1px 2px rgba(20,32,46,.04),0 3px 10px rgba(20,32,46,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--border)}
.head{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.stamp{text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.stamp b{color:var(--ink);font-weight:700}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:18px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.accent{background:linear-gradient(160deg,var(--accent) 0%,var(--accent2) 130%);border-color:transparent;color:#fff}
.kpi.accent .lab,.kpi.accent .foot{color:rgba(255,255,255,.82)}
.kpi.bad .val{color:var(--bad)}

/* nav */
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{color:var(--ink);border-color:var(--accent2)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

main{padding:20px 0 60px}
.panel{display:none;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel,.panel.on{animation:none}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card,.grid+.grid,.grid+.card,.card+.grid{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.ctitle{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.ctitle h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.ctitle .hint{font-size:12px;color:var(--muted)}

/* filter */
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
select.fsel{font-size:14px;font-weight:600;padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-width:260px;cursor:pointer}
select.fsel:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
tr.submarca td:first-child{padding-left:28px;color:var(--muted);font-weight:500}

/* tables */
table{width:100%;border-collapse:collapse}
.twrap{overflow-x:auto}
th,td{text-align:right;padding:9px 12px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;
  border-bottom:2px solid var(--border);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
thead th.no-sort{cursor:default}
tbody td{border-bottom:1px solid var(--border)}
tbody tr:hover{background:var(--surface2)}
tr.subhead td{background:var(--surface2);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border)}
#p-ficha tr.subhead td{font-size:12px}
#p-accion tr.subhead td{font-size:12px}
#p-metaago tr.subhead td{font-size:14px}
tr.colrep td{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface);border-bottom:1px solid var(--border);padding:5px 12px}
tr.total td{font-weight:800;border-top:2px solid var(--border);border-bottom:none;background:var(--surface2)}
tr.grandtotal td{font-weight:800;background:var(--accent-soft);border-bottom:none}
td.name{font-weight:600}
.mono{font-variant-numeric:tabular-nums}

/* pills + bars */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neu{background:var(--surface2);color:var(--muted)}
.cov{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cov .track{width:64px;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.cov .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.cov .pct{min-width:44px;text-align:right;font-weight:700}

/* supervisor cards */
.supgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.kpitiles{display:grid;gap:14px;margin-bottom:14px}
.supcard{border:1px solid var(--border);border-radius:var(--r);padding:15px;background:linear-gradient(165deg,var(--surface),var(--surface2))}
.supcard h3{font-size:14px;font-weight:800}
.supcard .who{font-size:11px;color:var(--muted);margin-bottom:12px}
.supcard .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px dashed var(--border)}
.supcard .row .l{font-size:12px;color:var(--muted)}
.supcard .row .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.supcard .big{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}

/* svg chart bits */
.chart{width:100%;height:auto;display:block}
.barlabel{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.barname{font-size:11.5px;fill:var(--ink);font-weight:600}
.axis{stroke:var(--border);stroke-width:1}
.gridln{stroke:var(--border);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.kpitiles{grid-template-columns:repeat(2,1fr) !important}}
/* Impresión / PDF: solo el reporte diario, ordenado y con colores */
@media print{
  @page{ size:A4 landscape; margin:8mm; }
  html,body{ background:#fff !important; }
  header, nav.tabs, .wrap > section.kpis, select.fsel, .tab, .no-print{ display:none !important; }
  main.wrap{ padding:0 !important; max-width:100% !important; }
  .panel{ display:none !important; }
  body:not(.print-ruta) #p-diario{ display:block !important; }
  body.print-ruta #p-ruta{ display:block !important; }
  .card{ box-shadow:none !important; border:1px solid #cfd6e0 !important; break-inside:avoid; margin:0 0 8px 0 !important; padding:10px 12px !important; }
  .card+.card,.grid+.grid,.grid+.card,.card+.grid{ margin-top:8px !important; }
  .grid{ gap:8px !important; }
  .grid.g2,.grid.g3{ grid-template-columns:1fr 1fr !important; }
  .twrap{ overflow:visible !important; }
  table{ font-size:9.5px !important; width:100% !important; }
  th,td{ padding:3px 6px !important; }
  .kpis{ display:grid !important; grid-template-columns:repeat(6,1fr) !important; gap:6px !important; padding:0 !important; }
  .kpi{ padding:7px 9px !important; } .kpi .val{ font-size:15px !important; } .kpi .lab{ font-size:8px !important; } .kpi .foot{ font-size:8px !important; }
  .supgrid{ grid-template-columns:repeat(3,1fr) !important; gap:8px !important; }
  .kpitiles{ grid-template-columns:repeat(3,1fr) !important; gap:8px !important; margin-bottom:8px !important; }
  .supcard{ padding:8px 10px !important; } .supcard .big{ font-size:16px !important; }
  .ctitle h2{ font-size:13px !important; } .ctitle .hint{ font-size:9px !important; }
  .cov .track,.track{ border:1px solid #bbb !important; }
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  body{ font-size:10px; }
}

/* ---------- Matinal (paleta fija, no depende del tema claro/oscuro) ---------- */
#p-matinal{ --m-navy:var(--accent); --m-teal:#17a3b8; --m-teal-dk:#0e8494; --m-pink:#ee3f70; --m-track:#e3e6ea; --m-bg:#eef0f4; --m-card:#ffffff; --m-txt:#20242f; }
#p-matinal{ background:var(--m-bg); border-radius:14px; padding:14px; color:var(--m-txt); }
.mat-top{ display:grid; grid-template-columns:200px 1fr 260px; gap:12px; align-items:stretch; margin-bottom:12px; }
.mat-headerbar{ background:var(--m-navy); border-radius:10px; padding:14px 22px; display:flex; align-items:center; justify-content:center; flex-direction:column; color:#fff; }
.mat-headerbar h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:.02em; }
.mat-headerbar span{ font-size:12.5px; opacity:.85; margin-top:2px; }
.mat-sidebtn{ background:var(--m-navy); color:#fff; border:0; border-radius:8px; font-weight:700; font-size:13px; padding:10px; cursor:pointer; width:100%; }
.mat-supbox select{ width:100%; height:100%; background:var(--m-navy); color:#fff; border:0; border-radius:8px; font-weight:700; font-size:13px; padding:10px; cursor:pointer; }
.mat-diasbox{ background:#fff; border-radius:10px; padding:8px; border:1px solid var(--m-track); }
.mat-diasbox .lbl{ font-weight:800; font-size:11.5px; color:var(--m-navy); margin-bottom:6px; }
.mat-diasgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.mat-daybtn{ background:var(--m-teal); color:#fff; border:0; border-radius:6px; font-weight:700; font-size:12px; padding:8px 4px; cursor:pointer; }
.mat-daybtn[aria-pressed="true"]{ background:var(--m-teal-dk); box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px var(--m-teal-dk); }
.mat-body{ display:grid; grid-template-columns:170px 1fr 260px; gap:14px; align-items:start; }
.mat-side{ background:var(--m-card); border-radius:10px; padding:12px; }
.mat-side h4{ margin:0 0 6px; font-size:11px; font-weight:800; color:#fff; background:var(--m-navy); padding:8px 10px; border-radius:6px; }
.mat-namelist{ max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.mat-namelist button{ background:var(--m-teal); color:#fff; border:0; border-radius:6px; font-weight:700; font-size:12.5px; padding:8px 10px; cursor:pointer; text-align:left; }
.mat-namelist button[aria-pressed="true"]{ background:var(--m-teal-dk); box-shadow:inset 0 0 0 2px #fff; }
.mat-codgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.mat-codgrid button{ background:var(--m-teal); color:#fff; border:0; border-radius:6px; font-weight:700; font-size:12.5px; padding:8px 0; cursor:pointer; }
.mat-codgrid button[aria-pressed="true"]{ background:var(--m-teal-dk); box-shadow:inset 0 0 0 2px #fff; }
.mat-center{ display:flex; flex-direction:column; gap:12px; }
.mat-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.mat-tile{ background:var(--m-card); border-radius:10px; overflow:hidden; }
.mat-tile h4{ margin:0; background:var(--m-navy); color:#fff; font-size:13.5px; font-weight:800; text-align:center; padding:9px 6px; display:flex; align-items:center; justify-content:center; gap:7px; }
.mat-tile h4 svg{ flex:0 0 auto; }
.mat-tile .toprow{ display:flex; align-items:flex-start; justify-content:space-between; padding:12px 14px 2px; gap:8px; }
.mat-tile .col{ text-align:left; }
.mat-tile .col.right{ text-align:right; }
.mat-tile .col .ico{ font-size:21px; display:block; line-height:1; margin-bottom:3px; }
.mat-tile .col .lbl{ font-size:10.5px; color:#7a7f8c; font-weight:600; }
.mat-tile .col .val{ font-size:20px; font-weight:800; color:var(--m-txt); }
.mat-tile .donutrow{ display:flex; justify-content:center; padding:2px 0 14px; }
.mat-donut{ position:relative; width:64px; height:64px; border-radius:50%; box-shadow:0 0 0 1.5px var(--accent); }
.mat-donut svg{ position:absolute; top:0; left:0; }
.mat-donut .pctv{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:16.5px; font-weight:800; color:var(--m-txt); }
.mat-sellout{ background:var(--m-card); border-radius:10px; padding:14px; text-align:center; }
.mat-sellout h4{ margin:0 0 8px; background:var(--m-navy); color:#fff; display:inline-block; padding:8px 16px; border-radius:6px; font-size:14px; font-weight:800; }
.mat-sellout .big{ font-size:34px; font-weight:800; color:var(--m-txt); }
.mat-brands{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.mat-bcard{ background:var(--m-card); border-radius:10px; overflow:hidden; text-align:center; }
.mat-bcard h4{ margin:0; background:var(--m-navy); color:#fff; font-size:13px; font-weight:800; padding:8px 4px; }
.mat-bcard .amt{ font-size:16.5px; font-weight:800; padding:9px 4px 3px; }
.mat-bcard .donutwrap{ padding:2px 0 10px; display:flex; justify-content:center; }
.mat-vd{ background:var(--m-card); border-radius:10px; padding:10px; overflow-x:auto; }
.mat-vd table{ width:100%; border-collapse:collapse; font-size:11px; table-layout:fixed; }
.mat-vd th{ text-align:left; font-size:10px; color:#7a7f8c; padding:4px 2px; border-bottom:1px solid var(--m-track); white-space:nowrap; }
.mat-vd th:not(:first-child),.mat-vd td:not(.n){ text-align:right; }
.mat-vd td{ padding:5px 2px; border-bottom:1px solid var(--m-track); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mat-vd td.n{ font-weight:800; color:var(--m-navy); }
.mat-vd tr:last-child td{ border-bottom:0; }
.mat-vd tr.tot td{ font-weight:800; color:var(--m-navy); border-top:2px solid var(--m-navy); border-bottom:0; padding-top:7px; }
.mat-vd th:first-child,.mat-vd td.n{ width:44%; }
.mat-vd th:nth-child(2),.mat-vd td:nth-child(2){ width:16%; }
.mat-vd th:nth-child(3),.mat-vd td:nth-child(3){ width:40%; }
@media (max-width:900px){
  .mat-top,.mat-body{ grid-template-columns:1fr !important; }
  .mat-tiles{ grid-template-columns:repeat(2,1fr); }
  .mat-brands{ grid-template-columns:repeat(2,1fr); }
}
</style>

<header>
  <div class="wrap head">
    <div class="brand">
      <span class="k">Comercializadora LP · NEW PGA</span>
      <h1>Tablero de Ventas</h1>
      <span class="sub">Seguimiento de cobertura, CCC y venta P&amp;G · Coordinación Damián González</span>
    </div>
    <div class="spacer"></div>
    <div class="stamp">
      Última fecha con datos<br><b id="st-fecha">—</b><br>
      <span id="st-uni">—</span>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="kpis" id="kpis"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</div>

<main class="wrap">
  <section class="panel" id="p-vend" role="tabpanel"></section>
  <section class="panel" id="p-ventadia" role="tabpanel"></section>
  <section class="panel" id="p-ficha" role="tabpanel"></section>
  <section class="panel" id="p-resumen" role="tabpanel"></section>
  <section class="panel" id="p-canales" role="tabpanel"></section>
  <section class="panel" id="p-marcas" role="tabpanel"></section>
  <section class="panel" id="p-diario" role="tabpanel"></section>
  <section class="panel" id="p-efec" role="tabpanel"></section>
  <section class="panel" id="p-concurso" role="tabpanel"></section>
  <section class="panel" id="p-evo" role="tabpanel"></section>
  <section class="panel" id="p-dev" role="tabpanel"></section>
  <section class="panel" id="p-infaltables" role="tabpanel"></section>
  <section class="panel" id="p-accion" role="tabpanel"></section>
  <section class="panel" id="p-ruta" role="tabpanel"></section>
  <section class="panel" id="p-covmarca" role="tabpanel"></section>
  <section class="panel" id="p-metaago" role="tabpanel"></section>
  <section class="panel" id="p-matinal" role="tabpanel"></section>

function __app(){
/* ---------- helpers ---------- */
(function normalizeArrays(){
  const toArr = v => v==null ? v : (Array.isArray(v) ? v : [v]);
  const top=['porVendedor','porSupervisor','porCanal','porCanalGrupo','porMarca','porFamilia','evolucion','devoluciones','topProductos','marcasOrden'];
  top.forEach(f=>{ if(DATA[f]!=null) DATA[f]=toArr(DATA[f]); });
  if(DATA.efectividad){
    ['porVendedor','porSupervisor','diaria'].forEach(f=>{ if(DATA.efectividad[f]!=null) DATA.efectividad[f]=toArr(DATA.efectividad[f]); });
  }
  if(DATA.concurso && DATA.concurso.porVendedor!=null) DATA.concurso.porVendedor=toArr(DATA.concurso.porVendedor);
  if(DATA.ruta && DATA.ruta.vendedores!=null) DATA.ruta.vendedores=toArr(DATA.ruta.vendedores);
  if(DATA.metaAgosto){
    ['porVendedor','porSupervisor','semanas','calendario'].forEach(f=>{ if(DATA.metaAgosto[f]!=null) DATA.metaAgosto[f]=toArr(DATA.metaAgosto[f]); });
    (DATA.metaAgosto.porVendedor||[]).forEach(v=>{ if(v.semanas!=null) v.semanas=toArr(v.semanas); if(v.diario!=null) v.diario=toArr(v.diario); });
  }
  if(DATA.accion){
    ['auto','todos'].forEach(sc=>{ const s=DATA.accion[sc]; if(s){ if(s.porVendedor!=null) s.porVendedor=toArr(s.porVendedor); if(s.porSupervisor!=null) s.porSupervisor=toArr(s.porSupervisor); } });
    if(DATA.accion.fechas!=null) DATA.accion.fechas=toArr(DATA.accion.fechas);

/* ---------- SVG chart builders ---------- */
function hbars(items,{val,label,color,fmt=peso,h=28,gap=8,namew=150,w=680}){
  const max=Math.max(...items.map(val),1);
  const H=items.length*(h+gap)+10;
  const bw=w-namew-90;
  let s=`<svg viewBox="0 0 ${w} ${H}" class="chart" role="img">`;
  items.forEach((it,i)=>{
    const y=i*(h+gap)+5; const v=val(it); const len=Math.max(2,bw*v/max);
    const col=typeof color==='function'?color(it):color;
    s+=`<text x="0" y="${y+h/2+4}" class="barname">${label(it)}</text>`;
    s+=`<rect x="${namew}" y="${y}" width="${len}" height="${h}" rx="5" fill="${col}"/>`;
    s+=`<text x="${namew+len+7}" y="${y+h/2+4}" class="barlabel">${fmt(v)}</text>`;
  });
  return s+'</svg>';
}
function areaChart(items,{w=980,h=280}){
  const pad={l:54,r:16,t:38,b:34};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const vals=items.map(d=>d.venta); const max=Math.max(...vals); const min=Math.min(0,...vals);
  const X=i=>pad.l+iw*i/(items.length-1);
  const Y=v=>pad.t+ih*(1-(v-min)/(max-min));
  let grid='',ax='';
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4;const y=Y(v);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" class="gridln"/>`;
    grid+=`<text x="${pad.l-8}" y="${y+4}" class="barlabel" text-anchor="end">${pesoC(v)}</text>`;}
  let line=items.map((d,i)=>(i?'L':'M')+X(i)+' '+Y(d.venta)).join(' ');
  let area=`M${X(0)} ${Y(min)} `+items.map((d,i)=>'L'+X(i)+' '+Y(d.venta)).join(' ')+` L${X(items.length-1)} ${Y(min)} Z`;
  let pts='',lbl='',vlbl='';
  items.forEach((d,i)=>{const x=X(i),y=Y(d.venta);
    pts+=`<circle cx="${x}" cy="${y}" r="${i===items.length-1?4:2.5}" fill="var(--accent)"/>`;
    const voff=13+(i%2)*13;
    vlbl+=`<text x="${x}" y="${Math.max(11,y-voff)}" class="barlabel" text-anchor="middle" style="font-weight:700;fill:var(--accent)">${pesoC(d.venta)}</text>`;
    if(i%2===0||i===items.length-1) lbl+=`<text x="${x}" y="${h-12}" class="barlabel" text-anchor="middle">${fdate(d.fecha)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">
    <defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent2)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts}${vlbl}${lbl}
  </svg>`;
}

function renderMarcas(){
  const p=document.getElementById('p-marcas');p.innerHTML='';

  bar.innerHTML=bh; p.appendChild(bar);
  const box=el('div'); p.appendChild(box);
  const sel=bar.querySelector('#mfSel');
  function mergeAll(kind){
    const acc=new Map();
    sups.forEach(s=>{ const arr=(eq[s]&&eq[s][kind])||[]; arr.forEach(x=>{ const name=(kind==='familias')?x.familia:x.marca; const cur=acc.get(name)||{clientes:0,venta:0}; cur.clientes+=(x.clientes||0); cur.venta+=(x.venta||0); acc.set(name,cur); }); });
    const out=[]; acc.forEach((val,name)=>{ const o={clientes:val.clientes,venta:val.venta}; if(kind==='familias')o.familia=name; else o.marca=name; out.push(o); });
    out.sort((a,b)=>b.venta-a.venta); return out;
  }

  });

  // ---- matriz infaltable x equipo (clientes que lo compraron) ----
  const E=DATA.infaltablesEquipo;
  if(E){
    const vends=Array.isArray(E.vendedores)?E.vendedores:[E.vendedores];
    const det2=Array.isArray(E.detalle)?E.detalle:[E.detalle];
    const sups=[...new Set(vends.map(v=>v.supervisor))];
    const card=el('div','card');
    let head='<div class="ctitle"><h2>Infaltables por equipo</h2><span class="hint">en cuántos clientes de cada equipo está presente cada infaltable · color = intensidad por columna</span></div>';
    head+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px"><select id="infEqSel" class="fsel"><option value="SUP">Comparar supervisores</option>';
    sups.forEach(s=>{ head+=`<option value="S:${s}">Equipo ${s}</option>`; });
    head+='</select><select id="infEqSort" class="fsel"><option value="mas">Más colocados primero</option><option value="menos">Menos colocados primero</option><option value="cat">Por categoría</option></select></div><div id="infEqBox"></div>';
    card.innerHTML=head; p.appendChild(card);
    const box=card.querySelector('#infEqBox'), selEq=card.querySelector('#infEqSel'), selSort=card.querySelector('#infEqSort');
    function drawEq(){
      const mode=selEq.value, sort=selSort.value;
      let cols=[];
      if(mode==='SUP'){ cols=sups.map(s=>({label:s, universo:vends.filter(v=>v.supervisor===s).reduce((a,v)=>a+(v.clientes||0),0), cods:vends.filter(v=>v.supervisor===s).map(v=>String(v.cod))})); }
      else { const s=mode.slice(2); cols=vends.filter(v=>v.supervisor===s).map(v=>({label:v.nombre, universo:v.clientes, cods:[String(v.cod)]})); }
      const val=(r,c)=>{ let t=0; c.cods.forEach(vc=>{ const x=r.v?r.v[vc]:0; if(x)t+=x; }); return t; };
      let rows=det2.map(r=>{ const cells=cols.map(c=>val(r,c)); return {r, cells, tot:cells.reduce((a,b)=>a+b,0)}; });
      if(sort==='mas') rows.sort((a,b)=>b.tot-a.tot);
      else if(sort==='menos') rows.sort((a,b)=>a.tot-b.tot);
      else rows.sort((a,b)=>(a.r.categoria+a.r.descripcion).localeCompare(b.r.categoria+b.r.descripcion));
      const cmax=cols.map((c,ci)=>Math.max(1,...rows.map(x=>x.cells[ci])));
      const heat=(v,ci)=>{ if(!v) return 'color:var(--border)'; const rr=Math.min(1,v/cmax[ci]); const a=(0.12+0.78*rr).toFixed(2); return `background:rgba(var(--accent2-rgb),${a});`+(rr>0.55?'color:#fff;font-weight:700':''); };
      let h='<div class="twrap"><table><thead><tr><th>Categoría</th><th>Infaltable</th><th>Canal</th>';
      cols.forEach(c=>{ h+=`<th class="num">${c.label}<br><span style="font-weight:600;color:var(--muted);font-size:11px">${AR.format(c.universo)} cli</span></th>`; });
      h+='</tr></thead><tbody>';
      rows.forEach(x=>{ h+=`<tr><td class="name">${x.r.categoria}</td><td class="name">${x.r.descripcion}</td><td style="color:var(--muted);font-size:11px">${x.r.canales}</td>`;
        x.cells.forEach((v,ci)=>{ h+=`<td class="num" style="${heat(v,ci)}">${v?AR.format(v):'·'}</td>`; }); h+='</tr>'; });
      const tot=cols.map((c,ci)=>rows.reduce((a,x)=>a+x.cells[ci],0));
      h+='<tr class="total"><td>Total colocaciones</td><td></td><td></td>';
      tot.forEach(t=>{ h+=`<td class="num">${AR.format(t)}</td>`; });
      h+='</tr></tbody></table></div>'; box.innerHTML=h;
    }
    selEq.onchange=drawEq; selSort.onchange=drawEq; drawEq();
  }
}

  head+='</div><div id="ruSum"></div><div id="ruBox"></div>';
  card.innerHTML=head; p.appendChild(card);
  const ruF=card.querySelector('#ruF'), ruV=card.querySelector('#ruV'), ruFil=card.querySelector('#ruFil'), sumEl=card.querySelector('#ruSum'), box=card.querySelector('#ruBox');
  card.querySelector('#ruPrint').addEventListener('click',()=>{ document.body.classList.add('print-ruta'); setTimeout(()=>{ try{window.print();}catch(e){} setTimeout(()=>document.body.classList.remove('print-ruta'),400); },60); });
  function draw(){

/* ---------- PANEL: Cobertura de marcas por vendedor y cliente ---------- */
function renderCoberturaMarcas(){
  const p=document.getElementById('p-covmarca'); p.innerHTML='';
  const CM=DATA.coberturaMarcas, marcas=DATA.marcasOrden;
  if(!CM || !marcas){ p.innerHTML='<div class="card"><div class="ctitle"><h2>Cobertura de marcas</h2></div><p style="color:var(--muted)">Sin datos de cobertura de marcas.</p></div>'; return; }
  const vends=DATA.porVendedor.filter(v=>!v.mayorista).slice().sort((a,b)=>b.venta-a.venta);
  const card=el('div','card');
  let head='<div class="ctitle"><h2>Cobertura de marcas por vendedor y cliente</h2><span class="hint">elegí un vendedor · filas = clientes que le compraron · columnas = marcas · color = intensidad de $ por marca en ese cliente</span></div>';
  head+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px">';
  head+='<select id="cmV" class="fsel">'+vends.map(v=>`<option value="${v.cod}">${v.nombre} (${v.supervisor.split(' ')[0]})</option>`).join('')+'</select>';
  head+='<select id="cmSort" class="fsel"><option value="venta">Ordenar por venta</option><option value="mas">Más marcas primero</option><option value="menos">Menos marcas primero</option><option value="nombre">Alfabético</option></select>';
  head+='</div><div id="cmSum"></div><div id="cmBox"></div>';
  card.innerHTML=head; p.appendChild(card);
  const selV=card.querySelector('#cmV'), selSort=card.querySelector('#cmSort'), sumEl=card.querySelector('#cmSum'), box=card.querySelector('#cmBox');
  function draw(){
    const vc=selV.value, sort=selSort.value;
    const V=CM[vc];
    if(!V || !V.clientes || !V.clientes.length){ sumEl.innerHTML=''; box.innerHTML='<div class="card"><p style="color:var(--muted)">Sin ventas de este vendedor en el período.</p></div>'; return; }
    let rows=V.clientes.slice();
    if(sort==='mas') rows.sort((a,b)=>b.nMarcas-a.nMarcas||b.venta-a.venta);
    else if(sort==='menos') rows.sort((a,b)=>a.nMarcas-b.nMarcas||b.venta-a.venta);
    else if(sort==='nombre') rows.sort((a,b)=>a.nombre.localeCompare(b.nombre));
    else rows.sort((a,b)=>b.venta-a.venta);
    const promMarcas=Math.round(10*rows.reduce((a,r)=>a+r.nMarcas,0)/rows.length)/10;
    sumEl.innerHTML=`<div class="kpitiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="supcard"><h3>Clientes con compra</h3><div class="big num">${AR.format(rows.length)}</div><div class="who">de este vendedor</div></div>
      <div class="supcard"><h3>Marcas promedio por cliente</h3><div class="big num">${promMarcas}</div><div class="who">sobre ${marcas.length} marcas P&amp;G</div></div>
      <div class="supcard"><h3>Clientes con 1 sola marca</h3><div class="big num" style="color:var(--warn2)">${AR.format(rows.filter(r=>r.nMarcas<=1).length)}</div><div class="who">oportunidad de mix</div></div></div>`;
    const cmax=marcas.map((m,mi)=>Math.max(1,...rows.map(r=>r.mk[mi]||0)));
    const heat=(v,mi)=>{ if(!v) return 'color:var(--border)'; const rr=Math.min(1,v/cmax[mi]); const a=(0.12+0.78*rr).toFixed(2); return `background:rgba(var(--accent2-rgb),${a});`+(rr>0.55?'color:#fff;font-weight:700':''); };
    let h='<div class="twrap"><table><thead><tr><th>Cliente</th><th class="num">Venta</th><th class="num"># Marcas</th>';
    marcas.forEach(m=>{ h+=`<th class="num">${m}</th>`; });
    h+='</tr></thead><tbody>';
    rows.forEach(r=>{ h+=`<tr><td class="name">${r.cod} - ${r.nombre}</td><td class="num">${peso(r.venta)}</td><td class="num">${r.nMarcas}</td>`;
      marcas.forEach((m,mi)=>{ const v=r.mk[mi]||0; h+=`<td class="num" style="${heat(v,mi)}">${v?peso(v):'·'}</td>`; }); h+='</tr>'; });
    h+='</tbody></table></div>'; box.innerHTML=h;
  }
  selV.onchange=draw; selSort.onchange=draw; draw();
}

    const RT=DATA.ruta, CM=DATA.coberturaMarcas, marcas=DATA.marcasOrden||[];

      const cmMap={}; cmVend.forEach(c=>{ cmMap[c.cod]=c; });
      let huboRuta=false;
      ['Lu','Ma','Mi','Ju','Vi'].forEach(w=>{

        if(!vd || !vd.cl || !vd.cl.length) return;
        huboRuta=true;
        rh+=`<h3 style="margin:14px 0 6px">${DIAS[w]} <span style="color:var(--muted);font-weight:600;font-size:12px">· ${vd.cl.length} clientes de ruta</span></h3>`;
        rh+='<div class="twrap"><table><thead><tr><th>Cliente</th><th>Subsegmento</th><th>Compró en el mes</th><th>Marcas ya vendidas</th></tr></thead><tbody>';
        vd.cl.forEach(([cliCod,ok])=>{
          const ci=(RT.clientes && RT.clientes[cliCod]) || ['(s/d)','',''];
          const cm=cmMap[cliCod];
          let badges='<span style="color:var(--muted)">sin compras este mes</span>';
          if(cm){
            const vendidas=marcas.filter((m,mi)=>(cm.mk[mi]||0)>0);
            badges=vendidas.map(m=>`<span class="pill ok" style="margin:2px 3px 2px 0;display:inline-block">${m}</span>`).join('')+` <span style="color:var(--muted);font-size:11px">(${cm.nMarcas}/${marcas.length})</span>`;
          }
          rh+=`<tr><td class="name">${cliCod} - ${ci[0]}</td><td style="color:var(--muted)">${ci[1]||''}</td><td class="num" style="color:${ok?'var(--good)':'var(--bad)'};font-weight:700">${ok?'✅ Sí':'❌ No'}</td><td>${badges}</td></tr>`;
        });
        rh+='</tbody></table></div>';
      });
      if(!huboRuta) rh+='<p style="color:var(--muted)">Sin ruta asignada para este vendedor.</p>';
    }
    rutaEl.innerHTML=rh;
  }
  fillVendedores(); selV.onchange=draw; draw();
}

/* ---------- PANEL: Matinal (réplica del PowerBI, paleta propia navy/teal/rosa) ---------- */
function matDonut(pctVal,{size=64,stroke=8,color='var(--m-pink)'}={}){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  const p=Math.max(0,Math.min(100,pctVal||0));
  const dash=c*p/100;
  return `<div class="mat-donut" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--m-track)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash.toFixed(1)} ${(c-dash).toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="pctv">${Math.round(p)}%</div>
  </div>`;
}

  selSupEl.onchange=()=>{ selSup=selSupEl.value; selVend=null; fillPickers(); draw(); };

  function vendorsInScope(){
    return vendsAll.filter(v=>(selSup==='TODOS'||v.supervisor===selSup) && (!selVend||v.cod===selVend));
  }
  function fillPickers(){
    const list=vendsAll.filter(v=>selSup==='TODOS'||v.supervisor===selSup).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
    namesBox.innerHTML=''; codsBox.innerHTML='';
    list.forEach(v=>{
      const nb=el('button',null,v.nombre); nb.setAttribute('aria-pressed',v.cod===selVend?'true':'false');
      nb.onclick=()=>{ selVend=(selVend===v.cod)?null:v.cod; syncPickers(); draw(); };
      namesBox.appendChild(nb);
      const cb=el('button',null,v.cod); cb.setAttribute('aria-pressed',v.cod===selVend?'true':'false');
      cb.onclick=()=>{ selVend=(selVend===v.cod)?null:v.cod; syncPickers(); draw(); };
      codsBox.appendChild(cb);
    });
  }
  function syncPickers(){
    const nombreSel=(vendsAll.find(v=>v.cod===selVend)||{}).nombre;
    [...namesBox.children].forEach(x=>x.setAttribute('aria-pressed', x.textContent===nombreSel?'true':'false'));
    [...codsBox.children].forEach(x=>x.setAttribute('aria-pressed', x.textContent===selVend?'true':'false'));
  }

  function draw(){
    const scope=vendorsInScope();
    const CGS=['Kioscos','Almacenes','Autoservicios'];
    const CGLBL={Kioscos:'KIOSCOS',Almacenes:'TRAD.',Autoservicios:'AS'};
    const agg={}; CGS.forEach(cg=>agg[cg]={universo:0,ccc:0});
    let totU=0, totC=0;
    scope.forEach(v=>{
      const vm=(M.porVendedor[v.cod]||{})[selDia]||{};
      Object.keys(vm).forEach(cg=>{ totU+=vm[cg].universo; totC+=vm[cg].ccc; if(agg[cg]){ agg[cg].universo+=vm[cg].universo; agg[cg].ccc+=vm[cg].ccc; } });
    });
    const scopeTeam = selVend ? (vendsAll.find(x=>x.cod===selVend)||{}).supervisor : (selSup!=='TODOS'?selSup:null);
    const covDonut = (u,c) => matDonut(u?100*c/u:0,{size:60,stroke:8,color:covColorTeam(u?100*c/u:0,scopeTeam)});
    const MATICO={
      Total:'<svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM8 13c-3 0-6 1.6-6 4v2h10v-2c0-1-.3-1.9-.9-2.6C10.3 13.5 9.2 13 8 13Zm8 .3c-.7 0-1.4.1-2 .3.9.9 1.5 2.1 1.5 3.4v2h6.5v-1.6c0-2.3-2.5-4.1-6-4.1Z"/></svg>',
      Kioscos:'<svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M3 7h18l-1 3.2c-.4.1-.8.2-1.3.2-.9 0-1.7-.4-2.2-1-.5.6-1.3 1-2.2 1s-1.7-.4-2.2-1c-.5.6-1.3 1-2.2 1s-1.7-.4-2.2-1c-.5.6-1.3 1-2.2 1-.5 0-.9-.1-1.3-.2L3 7Zm2.2 4.9c.5.1 1 .2 1.6.2.9 0 1.7-.2 2.2-.6.6.4 1.4.6 2.2.6s1.7-.2 2.2-.6c.6.4 1.4.6 2.2.6.6 0 1.1-.1 1.6-.2V19H5.2v-7.1Z"/></svg>',
      Almacenes:'<svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M4 3h16l1 5H3l1-5Zm-1 6h18v1.5c0 1-.8 1.8-1.8 1.8-.7 0-1.4-.4-1.7-1-.4.6-1 1-1.8 1s-1.4-.4-1.7-1c-.4.6-1 1-1.8 1s-1.4-.4-1.7-1c-.4.6-1 1-1.8 1s-1.4-.4-1.7-1c-.3.6-1 1-1.7 1C3.8 12.3 3 11.5 3 10.5V9Zm2 5h6v6H5v-6Zm8 0h6v6h-6v-6Z"/></svg>',
      Autoservicios:'<svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M2 3h2.2l.4 2H21a1 1 0 0 1 1 1.2l-1.6 7A1 1 0 0 1 19.4 14H8.1a1 1 0 0 1-1-.8L5 4H2V3Zm5 13a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm11 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>'
    };
    let th=`<div class="mat-tile"><h4>${MATICO.Total}TOTAL CARTERA</h4>
      <div class="toprow">
        <div class="col"><div class="lbl">Universo</div><div class="val">${AR.format(totU)}</div></div>
        <div class="col right"><div class="lbl">CCC</div><div class="val">${AR.format(totC)}</div></div>
      </div>
      <div class="donutrow">${covDonut(totU,totC)}</div>
    </div>`;
    CGS.forEach(cg=>{
      const a=agg[cg];
      th+=`<div class="mat-tile"><h4>${MATICO[cg]}${CGLBL[cg]}</h4>
        <div class="toprow">
          <div class="col"><div class="lbl">Universo</div><div class="val">${AR.format(a.universo)}</div></div>
          <div class="col right"><div class="lbl">CCC</div><div class="val">${AR.format(a.ccc)}</div></div>
        </div>
        <div class="donutrow">${covDonut(a.universo,a.ccc)}</div>
      </div>`;
    });
    tilesBox.innerHTML=th;

    const enRuta = selDia!=='TODOS';
    const DIASFULL={Lu:'Lunes',Ma:'Martes',Mi:'Miércoles',Ju:'Jueves',Vi:'Viernes'};
    const whoTxt = enRuta ? `Ruta ${DIASFULL[selDia]||selDia} · solo clientes de esa ruta` : 'Acumulado del mes';
    selloutWhoEl.textContent = whoTxt;
    brandsWhoEl.textContent = enRuta ? `Mix de la ruta ${DIASFULL[selDia]||selDia} (acumulado del mes, solo esos clientes)` : 'Mix acumulado del mes';
    vdWhoEl.textContent = whoTxt;
    const marcasOrdenGlobal=DATA.marcasOrden||[];
    function clientesDeRuta(vendCod){
      const RT=DATA.ruta; const vd=RT && (RT.data[selDia]||{})[vendCod]; if(!vd) return [];
      return vd.cl.map(([cliCod])=>cliCod);
    }
    function cmPorCliente(vendCod){
      const cm=(DATA.coberturaMarcas && DATA.coberturaMarcas[vendCod]) ? DATA.coberturaMarcas[vendCod].clientes : [];
      const map={}; cm.forEach(c=>map[c.cod]=c); return map;
    }

    let selloutTotal;
    if(enRuta){
      selloutTotal=scope.reduce((acc,v)=>{ const cm=cmPorCliente(v.cod); const cls=clientesDeRuta(v.cod);
        return acc+cls.reduce((a,cli)=>a+((cm[cli]||{}).venta||0),0); },0);
    }else{
      selloutTotal=scope.reduce((a,v)=>a+v.venta,0) + ((selSup==='TODOS' && !selVend) ? DATA.porVendedor.filter(v=>v.mayorista).reduce((a,v)=>a+v.venta,0) : 0);
    }
    selloutEl.textContent=peso(selloutTotal);

    const marcaMap=new Map();
    if(enRuta){
      scope.forEach(v=>{ const cm=cmPorCliente(v.cod); const cls=clientesDeRuta(v.cod);
        cls.forEach(cli=>{ const c=cm[cli]; if(!c) return; marcasOrdenGlobal.forEach((mk,mi)=>{ const val=c.mk[mi]||0; if(!val) return;
          const e=marcaMap.get(mk)||{venta:0,clientes:0}; e.venta+=val; e.clientes+=1; marcaMap.set(mk,e); }); });
      });
    }else{
      scope.forEach(v=>{
        const f=DATA.fichas&&DATA.fichas[v.cod]; if(!f) return;
        f.familias.forEach(fa=>fa.marcas.forEach(m=>{ const e=marcaMap.get(m.marca)||{venta:0,clientes:0}; e.venta+=m.venta; e.clientes+=(m.clientes||0); marcaMap.set(m.marca,e); }));
      });
    }
    const totalMarca=[...marcaMap.values()].reduce((a,b)=>a+b.venta,0)||1;
    const marcasOrdenadas=(DATA.marcasOrden||[...marcaMap.keys()]).slice().sort((a,b)=>a.localeCompare(b));
    let bh='';
    marcasOrdenadas.forEach(m=>{
      const e=marcaMap.get(m)||{venta:0,clientes:0}; const pctm=100*e.venta/totalMarca;
      const lbl=m==='HEAD AND SHOULDERS'?'H&amp;S':m;
      bh+=`<div class="mat-bcard"><h4>${lbl}</h4><div class="amt">${peso(e.venta)}</div><div class="donutwrap">${matDonut(pctm,{size:74,stroke:9})}</div></div>`;
    });
    brandsBox.innerHTML=bh;

    let totalClientesDistinct;
    if(enRuta){
      const setCli=new Set();
      scope.forEach(v=>{ const cm=cmPorCliente(v.cod); clientesDeRuta(v.cod).forEach(cli=>{ if(cm[cli]) setCli.add(cli); }); });
      totalClientesDistinct=setCli.size;
    }else{
      totalClientesDistinct=scope.reduce((a,v)=>a+v.ccc,0);
    }
    let vh='<table><thead><tr><th>Marca</th><th>Cl.</th><th>Venta</th></tr></thead><tbody>';
    marcasOrdenadas.forEach(m=>{
      const lbl=m==='HEAD AND SHOULDERS'?'H&amp;S':m;
      const e=marcaMap.get(m)||{venta:0,clientes:0};
      vh+=`<tr><td class="n">${lbl}</td><td>${AR.format(e.clientes)}</td><td>${peso(e.venta)}</td></tr>`;
    });
    vh+=`<tr class="tot"><td class="n">TOTAL</td><td>${AR.format(totalClientesDistinct)}</td><td>${peso(totalMarca)}</td></tr>`;
    vh+='</tbody></table>';
    vdBox.innerHTML=vh;
  }
  fillPickers(); draw();
}

/* ---------- vertical bar chart (efectividad diaria) ---------- */
function vbars(items,{w=980,h=240,val,label,fmt=(x=>x+'%'),color='var(--accent)'}){
  const pad={l:36,r:10,t:16,b:40}; const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const max=Math.max(...items.map(val),1); const n=items.length;
  const bw=Math.min(38,iw/n*0.7); const step=iw/n;
  let grid='';
  for(let g=0;g<=4;g++){const v=max*g/4;const y=pad.t+ih*(1-g/4);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" class="gridln"/><text x="${pad.l-6}" y="${y+4}" class="barlabel" text-anchor="end">${Math.round(v)}</text>`;}
  let bars='';
  items.forEach((d,i)=>{const v=val(d); const bh=ih*v/max; const x=pad.l+step*i+(step-bw)/2; const y=pad.t+ih-bh;
    const c=typeof color==='function'?color(d):color;
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="3" fill="${c}"/>`;
    bars+=`<text x="${x+bw/2}" y="${y-4}" class="barlabel" text-anchor="middle">${v>0?fmt(v):''}</text>`;
    bars+=`<text x="${x+bw/2}" y="${h-24}" class="barlabel" text-anchor="middle">${label(d)}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">${grid}${bars}</svg>`;
}

      h+=`<tr class="total"><td>Subtotal ${titulo}</td><td class="num">${peso(tb)}</td><td class="num">${AR.format(tc)}</td><td></td><td class="num">${AR.format(tp)}</td><td class="num">${AR.format(te)}</td><td class="num">${pct(ep)}</td><td class="num">${pct(cb)}</td><td></td><td></td></tr>`;
    });
    h+=`<tr class="total"><td>Ventas del día (equipo)</td><td class="num">${peso(k.ventaBruta)}</td><td class="num">${AR.format(k.ccc)}</td><td class="num">${AR.format(k.marcas)}</td><td class="num">${AR.format(k.planificados)}</td><td class="num">${AR.format(k.efectivos)}</td><td class="num">${pct(k.efectividad)}</td><td class="num">${pct(k.cobertura)}</td><td></td><td></td></tr>`;

    h+=`<tr class="grandtotal"><td>VENTA NETA c/IVA (Gerencia)</td><td class="num">${peso(k.venta)}</td><td colspan="8"></td></tr>`;
    h+='</tbody></table></div></div>';
    box.innerHTML=h;
    // ===== BLOQUE 3: Ficha de performance del día =====
    const perf=document.createElement('div'); perf.className='card no-print';
    perf.innerHTML='<div class="ctitle"><h2>Ficha de performance del día</h2><span class="hint">elegí un equipo o un vendedor</span></div>';
    const ps=document.createElement('select'); ps.className='fsel';
    const sset=[...new Set(r.porVendedor.map(v=>v.supervisor))].filter(s=>s.indexOf('N/A')<0);
    sset.sort((a,b)=>{const o=['LUCY CEJAS','JUAN ARMANDOLA'];const ia=o.indexOf(a),ib=o.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib);});
    sset.forEach(s=>{const o=document.createElement('option');o.value='T|'+s;o.textContent='▸ Equipo '+s;ps.appendChild(o);});
    sset.forEach(s=>{const og=document.createElement('optgroup');og.label=s;r.porVendedor.filter(v=>v.supervisor===s).sort((a,b)=>b.ventaBruta-a.ventaBruta).forEach(v=>{const o=document.createElement('option');o.value='V|'+v.cod;o.textContent='   '+v.nombre;og.appendChild(o);});ps.appendChild(og);});
    perf.appendChild(ps);
    const pb=document.createElement('div'); pb.style.marginTop='12px'; perf.appendChild(pb);

    function drawPerf(val){
      const tp=val.slice(0,1); const id=val.slice(2); let hh='';

/* ---------- pantalla de contrasena; __app() arranca recien tras descifrar ---------- */
(function(){
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const E=__ENC;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0e1726;padding:20px';
  ov.innerHTML='<div style="max-width:360px;width:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center">'
   +'<div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7fd7d7;font-weight:700">Comercializadora LP &middot; NEW PGA</div>'
   +'<h2 style="margin:6px 0 4px;color:#e8eef7;font-size:22px">Tablero de Ventas</h2>'
   +'<p style="margin:0 0 16px;color:#9fb0c4;font-size:14px">Ingresa la contrasena para ver el tablero</p>'
   +'<input id="__pw" type="password" autocomplete="current-password" placeholder="Contrasena" style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border-radius:10px;border:1px solid #2a3a52;background:#fff;color:#111">'
   +'<button id="__go" style="margin-top:12px;width:100%;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#0e9aa7;color:#fff;cursor:pointer">Entrar</button>'
   +'<div id="__err" style="margin-top:10px;color:#ff8a8a;font-size:13px;height:16px"></div></div>';
  document.body.appendChild(ov);
  const pw=ov.querySelector('#__pw'), go=ov.querySelector('#__go'), err=ov.querySelector('#__err');
  async function tryOpen(){
    err.textContent=''; go.disabled=true; go.textContent='Descifrando...';
    try{
      const enc=new TextEncoder();
      const km=await crypto.subtle.importKey('raw',enc.encode(pw.value),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(E.salt),iterations:E.iters,hash:'SHA-256'},km,512);
      const raw=new Uint8Array(bits); const aesKey=raw.slice(0,32), macKey=raw.slice(32,64);
      const iv=b64(E.iv), ct=b64(E.ct), mac=b64(E.mac);
      const hk=await crypto.subtle.importKey('raw',macKey,{name:'HMAC',hash:'SHA-256'},false,['verify']);
      const data=new Uint8Array(iv.length+ct.length); data.set(iv,0); data.set(ct,iv.length);
      const ok=await crypto.subtle.verify('HMAC',hk,mac,data);
      if(!ok) throw new Error('bad');
      const ak=await crypto.subtle.importKey('raw',aesKey,{name:'AES-CBC'},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},ak,ct);
      DATA=JSON.parse(new TextDecoder().decode(pt));
      ov.remove(); __app();
    }catch(e){ go.disabled=false; go.textContent='Entrar'; err.textContent='Contrasena incorrecta'; pw.select(); }
  }
  go.addEventListener('click',tryOpen);
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') tryOpen(); });
  pw.focus();
})();
